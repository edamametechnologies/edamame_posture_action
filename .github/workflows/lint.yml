name: Lint

on:
  push:
    branches:
      - 'dev'
      - 'main'
  pull_request:

permissions:
  contents: read

jobs:
  expression-length:
    name: Step expression length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyyaml
      - run: python scripts/check_expression_length.py action.yml .github/workflows/*.yml
