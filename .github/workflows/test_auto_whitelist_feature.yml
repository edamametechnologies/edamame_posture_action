name: Test Auto-Whitelist Feature

# One iteration of the auto-whitelist lifecycle, dispatched by
# test_auto_whitelist_runner.yml (tests/test_auto_whitelist_feature.sh):
# 1. Setup: the action takes the whitelist the previous iteration saved and
#    decides this run's mode from its state (learning or enforcing).
# 2. Traffic: the same endpoints every iteration (plus one more from
#    iteration 2, so learning has something to add).
# 3. Enforcing only: the CVE-2025-30066 gist fetch.
# 4. Teardown: learning runs must pass; an enforcing run must fail, report the
#    gist fetch and not learn it.
#
# Every assertion reads the action's own record
# ($RUNNER_TEMP/edamame-auto-whitelist/auto_whitelist_verdict.json): no
# counting of log lines.

on:
  workflow_dispatch:
    inputs:
      iteration:
        description: 'Iteration number (for tracking)'
        required: false
        default: '1'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  test-auto-whitelist:
    name: "Iteration #${{ inputs.iteration }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Show iteration info"
        run: |
          echo "========================================"
          echo "  AUTO-WHITELIST TEST - ITERATION ${{ inputs.iteration }}"
          echo "========================================"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Run ID: ${{ github.run_id }}"
          echo "========================================"

      # PHASE 1: Setup
      - name: "Setup EDAMAME Posture"
        uses: ./
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          wait_for_api: true
          network_scan: true
          packet_capture: true
          auto_whitelist: true
          auto_whitelist_artifact_name: test-auto-whitelist-feature-${{ github.ref_name }}
          # Few runs: the lifecycle test has to end in an enforcing run within
          # ~8 iterations. GitHub's own hosted-runner traffic (rotating result
          # storage accounts, regional hosts) keeps some runs from being clean,
          # so the whitelist may be enforced by max_iterations rather than by
          # stability; the verdict records which.
          auto_whitelist_stability_consecutive_runs: "2"
          auto_whitelist_max_iterations: "6"

      - name: "Mode decided at setup"
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          config="$EDAMAME_AUTO_WHITELIST_DIR/auto_whitelist_config.json"
          jq . "$config"
          echo "mode=$(jq -r '.start_mode' "$config")" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r '.start_reason' "$config")" >> "$GITHUB_OUTPUT"
          echo "This run starts: $(jq -r '.start_mode + " (" + .start_reason + ")"' "$config")"

      # PHASE 2: Generate traffic
      - name: "Generate test traffic"
        shell: bash
        run: |
          echo "--- GENERATING TRAFFIC ---"
          echo -n "api.github.com/zen: "
          curl -s --max-time 10 https://api.github.com/zen > /dev/null && echo "OK" || echo "FAIL"
          echo -n "github.com/robots.txt: "
          curl -s --max-time 10 https://github.com/robots.txt > /dev/null && echo "OK" || echo "FAIL"
          echo -n "registry.npmjs.org/-/ping: "
          curl -s --max-time 10 https://registry.npmjs.org/-/ping > /dev/null && echo "OK" || echo "FAIL"

          iteration="${{ inputs.iteration }}"
          if ! [[ "$iteration" =~ ^[0-9]+$ ]]; then
            echo "Invalid iteration value: $iteration"
            exit 1
          fi
          if (( iteration >= 2 )); then
            echo -n "www.npmjs.com: "
            curl -s --max-time 10 https://www.npmjs.com/ > /dev/null && echo "OK" || echo "FAIL"
          fi

          echo "Waiting 60s for name and process resolution..."
          sleep 60

      # PHASE 2.5: CVE-2025-30066 (enforcing runs only)
      - name: "CVE-2025-30066 Detection Test"
        if: steps.mode.outputs.mode == 'enforcing'
        shell: bash
        run: |
          echo "SIMULATING CVE-2025-30066: fetching a payload from gist.githubusercontent.com"
          echo "(it answers on the same Fastly addresses as raw.githubusercontent.com)"
          curl -s --max-time 10 -o /dev/null -w "HTTP %{http_code}\n" \
            "https://gist.githubusercontent.com/gewashington/a4d0211e6f8601b69ff74e30d9e3ca20/raw/9d3e37cf7742b41e39606e70aab7a4f971353749/practice-python-fibonnaci.py" || true
          echo "Waiting 30s for the daemon to name the session..."
          sleep 30

      # PHASE 3: Teardown
      - name: "Dump sessions"
        id: dump_sessions
        uses: ./
        with:
          dump_sessions_log: true
        continue-on-error: true

      - name: "Assert iteration outcome"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ steps.mode.outputs.mode }}"
          dump_outcome="${{ steps.dump_sessions.outcome }}"
          verdict_file="$EDAMAME_AUTO_WHITELIST_DIR/auto_whitelist_verdict.json"
          whitelist_file="$EDAMAME_AUTO_WHITELIST_DIR/auto_whitelist.json"
          if [[ ! -f "$verdict_file" ]]; then
            echo "::error::The auto-whitelist teardown recorded no verdict ($verdict_file)."
            exit 1
          fi
          jq '{start_mode, start_reason, verdict, evaluated, non_conforming: (.non_conforming | length), added: (.added | length), iteration, stable_count, next_mode, next_reason}' "$verdict_file"
          verdict=$(jq -r '.verdict' "$verdict_file")
          start_mode=$(jq -r '.start_mode' "$verdict_file")

          if [[ "$start_mode" != "$mode" ]]; then
            echo "::error::The teardown ran in mode '$start_mode' but setup decided '$mode'."
            exit 1
          fi
          if [[ "$(jq -r '.evaluated' "$verdict_file")" -lt 1 ]]; then
            echo "::error::No egress session was checked: the capture saw nothing."
            exit 1
          fi

          if [[ "$mode" != "enforcing" ]]; then
            if [[ "$dump_outcome" != "success" ]]; then
              echo "::error::A learning run must not fail (dump outcome: $dump_outcome)."
              exit 1
            fi
            if [[ "$verdict" != "learning" ]]; then
              echo "::error::Expected a learning verdict, got '$verdict'."
              exit 1
            fi
            echo "Learning iteration succeeded: added $(jq '.added | length' "$verdict_file"), stable runs $(jq -r '.stable_count' "$verdict_file"), next run $(jq -r '.next_mode' "$verdict_file")."
            exit 0
          fi

          if [[ "$dump_outcome" != "failure" ]]; then
            echo "::error::An enforcing run with the gist fetch must fail (dump outcome: $dump_outcome)."
            exit 1
          fi
          if [[ "$verdict" != "violation" ]]; then
            echo "::error::Expected a violation verdict, got '$verdict'."
            exit 1
          fi
          if ! jq -e '[.non_conforming[] | select((.dst_domain // "") | ascii_downcase | endswith("gist.githubusercontent.com"))] | length > 0' "$verdict_file" >/dev/null; then
            echo "::error::The gist fetch is not among the reported violations:"
            jq -r '.non_conforming[] | "  \(.dst_domain // "(no name)") \(.dst_ip):\(.dst_port) \(.process // "?")"' "$verdict_file"
            exit 1
          fi
          if jq -e '[.whitelists[] | .endpoints[] | (.domain // ""), (.domains // [])[] | select(ascii_downcase | contains("gist.githubusercontent.com"))] | length > 0' "$whitelist_file" >/dev/null; then
            echo "::error::The gist endpoint was learned by an enforcing run."
            exit 1
          fi
          echo "Enforcement iteration succeeded: started enforcing ($(jq -r '.start_reason' "$verdict_file")), the gist fetch failed the job and was not learned."

      - name: "Stop EDAMAME Posture"
        if: always()
        uses: ./
        with:
          stop: true
        continue-on-error: true
