name: Test Auto-Whitelist Runner

# Orchestrates runs of test_auto_whitelist_feature.yml to validate the
# auto-whitelist lifecycle on real runners (tests/test_auto_whitelist_feature.sh):
#   1. Clean slate (the test's artifacts are deleted)
#   2. Learning runs, each started in the mode the previous run saved
#   3. An enforcing run that must fail on the CVE-2025-30066 gist fetch,
#      report it and not learn it
# Fails on any iteration failure, a broken state chain, or no enforcing run
# within the budget.

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:
  push:
    branches:
      - 'dev'
      - 'main'
    paths:
      - 'action.yml'
      - 'scripts/auto_whitelist.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test-auto-whitelist-runner:
    name: Auto-Whitelist Lifecycle Test
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: "Setup EDAMAME Posture"
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          auto_remediate: false
          network_scan: false
          checkout: true
          wait_for_api: true

      - name: "Run lifecycle test"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./tests/test_auto_whitelist_feature.sh

      - name: "Upload test artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-whitelist-test-results-${{ github.run_id }}
          path: /tmp/auto_whitelist_test_results
          retention-days: 7
          if-no-files-found: ignore
