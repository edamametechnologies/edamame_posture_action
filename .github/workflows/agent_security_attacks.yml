name: Agent Security Attack Detection Demo

# Runs EDAMAME's attack scenario corpus -- the one edamame_posture's release
# gate runs (tests/security/run_cve_detection.sh, the security job of its
# tests.yml) -- through this action against the latest released
# edamame_posture, one scenario per leg, on a GitHub-hosted runner.
#
# The scenario list, the trigger scripts, each scenario's expected check and
# its detection criteria all come from edamame_posture at the latest release
# tag (scripts/posture_release_ref.sh): the version this action installs, so
# triggers and detector always match, and a scenario added to the gate runs
# here from the release that ships it, with no change to this file. The
# posture_ref dispatch input runs another ref (for instance `main` before a
# release). agent_security/tests/e2e/DEMO.md walks an operator through the
# same corpus locally.
#
# Each leg:
#   1. Starts the EDAMAME Posture daemon in disconnected mode with packet
#      capture, the attack pattern detector and LLM adjudication (Portal).
#   2. Installs edamame_cli and stages edamame_posture's tests/security at the
#      resolved ref.
#   3. Runs run_cve_detection.sh for its scenario: cleanup, trigger, detector
#      ticks, verification; the leg passes only when the scenario's status is
#      `pass` (a `skip` is not a pass, as in edamame_posture's gate).
#   4. Clears the findings the trigger fired, so the runner-protection gate of
#      the action's own stop stays meaningful.

on:
  schedule:
    # Daily at 02:00 UTC (offset from CVE-2025-30066.yml at 01:00).
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      posture_ref:
        description: "edamame_posture ref to take the scenarios and triggers from (default: the latest release tag, the version this action installs)"
        type: string
        default: ""
      scenarios:
        description: "Comma-separated subset of the scenario list (default: every scenario)"
        type: string
        default: ""
      python:
        description: "Interpreter the triggers run with: the runner's own /usr/bin/python3 (system, what code on the runner would use) or actions/setup-python's (setup-python, as edamame_posture's gate does)"
        type: choice
        options:
          - system
          - setup-python
        default: system
  push:
    branches:
      - 'dev'
      - 'main'
    paths:
      - '.github/workflows/agent_security_attacks.yml'
      - 'scripts/posture_release_ref.sh'

concurrency:
  # A dispatch is an operator's run with its own inputs: it neither cancels
  # nor is cancelled by another run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    name: Scenario list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.list.outputs.ref }}
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - name: Checkout edamame_posture_action
        uses: actions/checkout@v4

      - name: Resolve the edamame_posture ref and its scenario list
        id: list
        env:
          POSTURE_REF: ${{ inputs.posture_ref }}
          SUBSET: ${{ inputs.scenarios }}
        run: |
          set -euo pipefail
          ref=$(bash scripts/posture_release_ref.sh)
          url="https://raw.githubusercontent.com/edamametechnologies/edamame_posture_cli/${ref}/tests/security/run_cve_detection.sh"
          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "$url" -o run_cve_detection.sh
          csv=$(sed -n 's/^SCENARIOS_CSV="\([^"]*\)".*/\1/p' run_cve_detection.sh | head -n 1)
          if [[ -z "$csv" ]]; then
            echo "::error::No SCENARIOS_CSV in run_cve_detection.sh at edamame_posture ${ref}"
            exit 1
          fi
          scenarios=$(printf '%s\n' "$csv" | tr ',' '\n' | sed '/^$/d' | jq -R . | jq -cs .)
          if [[ -n "${SUBSET:-}" ]]; then
            wanted=$(printf '%s\n' "$SUBSET" | tr ',' '\n' | sed 's/ //g; /^$/d' | jq -R . | jq -cs .)
            unknown=$(jq -cn --argjson w "$wanted" --argjson a "$scenarios" '$w - $a')
            if [[ "$unknown" != "[]" ]]; then
              echo "::error::Not in the scenario list of edamame_posture ${ref}: ${unknown}"
              exit 1
            fi
            scenarios=$(jq -cn --argjson w "$wanted" --argjson a "$scenarios" '[$a[] | select(. as $s | $w | index($s))]')
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          echo "edamame_posture ${ref}: $(printf '%s' "$scenarios" | jq 'length') scenarios"
          printf '%s' "$scenarios" | jq -r '.[]'

  detect-attack:
    name: ${{ matrix.scenario }}
    needs: scenarios
    runs-on: ubuntu-latest
    # Setup, the cli install, then run_cve_detection.sh's readiness wait,
    # trigger, verification polls and its retries for one scenario.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.scenarios.outputs.scenarios) }}
    env:
      POSTURE_SECURITY_REF: ${{ needs.scenarios.outputs.ref }}
      SCENARIO: ${{ matrix.scenario }}

    steps:
      - name: Describe scenario
        run: |
          echo "Scenario        : $SCENARIO"
          echo "edamame_posture : $POSTURE_SECURITY_REF (tests/security/run_cve_detection.sh)"
          echo "Interpreter     : ${{ inputs.python || 'system' }}"

      - name: Checkout edamame_posture_action
        uses: actions/checkout@v4

      - name: Setup EDAMAME Posture with the attack pattern detector
        uses: ./
        with:
          disconnected_mode: true
          network_scan: true
          packet_capture: true
          # run_cve_detection.sh asserts the expected detection itself; the
          # blacklist / anomaly enforcement layers must not cancel the job
          # before it has looked.
          check_blacklist: false
          check_anomalous: false
          vulnerability_detection: true
          vulnerability_detection_interval: "60"
          agentic_mode: analyze
          agentic_provider: edamame
          agentic_interval: 60
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      - name: Set up Python (setup-python)
        if: inputs.python == 'setup-python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Choose the triggers' interpreter
        run: |
          if [[ "${{ inputs.python }}" == "setup-python" ]]; then
            echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          else
            echo "PYTHON=/usr/bin/python3" >> "$GITHUB_ENV"
          fi

      - name: Install edamame_cli
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --proto '=https' --tlsv1.2 -sSf \
                https://raw.githubusercontent.com/edamametechnologies/edamame_cli/main/install.sh \
                | sudo -E sh -s --; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::edamame_cli could not be installed"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          cli=$(command -v edamame_cli 2>/dev/null || echo /usr/local/bin/edamame_cli)
          "$cli" --version
          echo "EDAMAME_CLI=$cli" >> "$GITHUB_ENV"

      - name: Stage edamame_posture's scenario runner and triggers
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/edamame_posture_security"
          rm -rf "$stage"
          mkdir -p "$stage"
          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL \
            "https://codeload.github.com/edamametechnologies/edamame_posture_cli/tar.gz/${POSTURE_SECURITY_REF}" |
            tar -xz -C "$stage" --strip-components=1 --wildcards '*/tests/security'
          test -s "$stage/tests/security/run_cve_detection.sh"
          # Staged like edamame_posture's security job: a scratch copy of the
          # vendored triggers.
          triggers="${RUNNER_TEMP}/cve_triggers"
          rm -rf "$triggers"
          mkdir -p "$triggers"
          cp -R "$stage/tests/security/triggers/." "$triggers/"
          echo "POSTURE_SECURITY_DIR=$stage/tests/security" >> "$GITHUB_ENV"
          echo "CVE_TRIGGERS_DIR=$triggers" >> "$GITHUB_ENV"
          ls "$triggers"

      - name: Run the scenario (run_cve_detection.sh)
        run: |
          set -euo pipefail
          mkdir -p results
          rc=0
          bash "$POSTURE_SECURITY_DIR/run_cve_detection.sh" \
            --triggers-dir "$CVE_TRIGGERS_DIR" \
            --output-dir results \
            --agent-type openclaw \
            --scenarios "$SCENARIO" || rc=$?
          row=""
          if [[ -s results/results.json ]]; then
            row=$(jq -c --arg s "$SCENARIO" '[.scenarios[] | select(.scenario == $s)] | last // empty' results/results.json)
          fi
          if [[ -z "$row" ]]; then
            echo "::error::run_cve_detection.sh recorded no result for $SCENARIO (exit code $rc)"
            exit 1
          fi
          status=$(jq -r '.status' <<< "$row")
          echo "$SCENARIO: $status (expected $(jq -r '.expected_check' <<< "$row"); findings $(jq -r '.finding_total' <<< "$row"), alertable $(jq -r '.finding_alertable' <<< "$row"), severities $(jq -r '.severities' <<< "$row"))"
          if [[ "$status" != "pass" ]]; then
            echo "::error::EDAMAME did not detect $SCENARIO (status: $status; $(jq -r '.extra' <<< "$row"))"
            exit 1
          fi

      # The daemon's own log, as edamame_posture's gate keeps it: the
      # foundation logger writes /var/log/edamame/edamame_posture_<PID>.<date>
      # on Linux, and a miss is triaged from it (FIM writer attribution,
      # detector diagnostics).
      - name: Collect the daemon logs
        if: always()
        run: |
          mkdir -p results/daemon-logs
          if [[ -d /var/log/edamame ]]; then
            sudo cp -a /var/log/edamame/. results/daemon-logs/ 2>/dev/null || true
            sudo chown -R "$(id -u):$(id -g)" results/daemon-logs 2>/dev/null || true
          fi
          ls -la results/daemon-logs

      - name: Upload detection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-security-detection-${{ matrix.scenario }}-${{ github.run_id }}
          path: results/
          if-no-files-found: warn

      # The trigger intentionally fires HIGH/CRITICAL findings. Clear them
      # before the daemon stops so the on-disk state is clean (as
      # test_vulnerability_gate.yml does).
      - name: Clear runtime attack pattern state (test artifacts)
        if: always()
        run: |
          if [[ -n "${CVE_TRIGGERS_DIR:-}" && -f "$CVE_TRIGGERS_DIR/cleanup.py" ]]; then
            python3 "$CVE_TRIGGERS_DIR/cleanup.py" --agent-type openclaw || true
          fi
          if [[ -n "${EDAMAME_CLI:-}" ]]; then
            "$EDAMAME_CLI" rpc clear_attack_pattern_history || true
            "$EDAMAME_CLI" rpc reset_attack_pattern_suppressions || true
          fi

      - name: Stop posture daemon
        if: always()
        uses: ./
        with:
          stop: true
        continue-on-error: true

      # Alerts come from the default branch only: a dispatch on another
      # branch is a validation run whose failures are read in the run itself.
      - name: Slack alert on detection failure
        if: failure() && github.ref_name == github.event.repository.default_branch
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            Agent Security Attack Detection Demo: `${{ matrix.scenario }}` (edamame_posture ${{ needs.scenarios.outputs.ref }})
            failed in ${{ github.repository }} on ${{ github.ref }}.
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

  summary:
    name: Detection summary
    needs: [scenarios, detect-attack]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print rollup
        run: |
          echo "::notice::Agent Security Attack Detection Demo finished (edamame_posture ${{ needs.scenarios.outputs.ref }})."
          echo "Result of detect-attack matrix: ${{ needs.detect-attack.result }}"
          if [[ "${{ needs.detect-attack.result }}" != "success" ]]; then
            echo "::error::At least one attack scenario was NOT detected by EDAMAME."
            exit 1
          fi
          echo "Every attack scenario of edamame_posture ${{ needs.scenarios.outputs.ref }} was detected by EDAMAME."

      - name: Slack alerts
        if: failure() && github.ref_name == github.event.repository.default_branch
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: "Agent security attack detection rollup in ${{ github.repository }} on branch ${{ github.ref }} failed (detect-attack result: ${{ needs.detect-attack.result }}): see https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true
