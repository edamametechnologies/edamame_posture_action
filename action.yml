name: "Setup EDAMAME Posture"
description: "Download and control EDAMAME Posture"
inputs:
  edamame_user:
    description: "EDAMAME user (required to start the process in the background)"
    required: false
  edamame_domain:
    description: "EDAMAME domain (required to start the process in the background)"
    required: false
  edamame_pin:
    description: "EDAMAME PIN (required to start the process in the background)"
    required: false
  edamame_id:
    description: "EDAMAME identifier suffix (required to start the process in the background)"
    required: false
  edamame_policy:
    description: "EDAMAME policy name that the device must comply with (the action will fail if the device does not comply)"
    required: false
  edamame_minimum_score:
    description: "Minimum score that the device must achieve (the action will fail if the device does not achieve the minimum score)"
    required: false
  edamame_mandatory_threats:
    description: "Comma separated list of mandatory threats that the device must not exhibit (the action will fail if the device does not detect the threats)"
    required: false
  edamame_mandatory_prefixes:
    description: "Comma separated list of mandatory tag prefixes covering threats that the device must not exhibit (the action will fail if the device does not have the prefixes)"
    required: false
  auto_remediate:
    description: "Automatically remediate posture issues"
    required: false
    default: "false"
  skip_remediations:
    description: "Remediations to skip when performing auto-remediations (comma separated)"
    required: false
    default: "remote login enabled,remote desktop enabled,local firewall disabled"
  network_scan:
    description: "Scan network for critical devices (only applicable if the background process is started)"
    required: false
    default: "false"
  packet_capture:
    description: "Capture network traffic (auto = follow network_scan)"
    required: false
    default: "auto"
  check_whitelist:
    description: "Report and enforce whitelist exceptions when capturing network traffic (requires a whitelist name)"
    required: false
    default: "false"
  check_blacklist:
    description: "Report and enforce blacklist matches during network capture"
    required: false
    default: "true"
  check_anomalous:
    description: "Deprecated for live enforcement; vulnerability findings are now used for live cancellation"
    required: false
    default: "true"
  cancel_on_violation:
    description: "Attempt to cancel the current CI pipeline when violations are detected"
    required: false
    default: "false"
  cancel_pipeline_script:
    description: "Path to custom cancellation script (default: /tmp/cancel_pipeline.sh). Script receives violation reason as first argument."
    required: false
    default: ""
  disconnected_mode:
    description: "Start EDAMAME Posture in disconnected mode without requiring domain authentication"
    required: false
    default: "false"
  dump_sessions_log:
    description: "Dump sessions log (requires background process with packet capture enabled)"
    required: false
    default: "false"
  checkout:
    description: "Checkout the repo through the git CLI (retry if access is not granted)"
    required: false
    default: "false"
  checkout_submodules:
    description: "Checkout submodules"
    required: false
    default: "false"
  wait_for_https:
    description: "Wait for https access to the repo be granted"
    required: false
    default: "false"
  wait:
    description: "Wait for a while for access to be granted"
    required: false
    default: "false"
  wait_for_api:
    description: "Wait for API access to be granted"
    required: false
    default: "false"
  wait_repository:
    description: "Repository (owner/name) whose access wait_for_api and wait_for_https probe; defaults to the workflow's repository. Set it to a private or internal repository the job needs when the workflow's own repository is public: public reads are not restricted, so probing a public repository returns at once and proves nothing, while pushes, token-created pull requests and releases, and private repositories stay refused until the runner is listed."
    required: false
    default: ""
  token:
    description: "GitHub token to checkout the repo"
    required: false
    default: ${{ github.token }}
  whitelist:
    description: "Whitelist to use for the network scan (only applicable if the background process is started)"
    required: false
    default: ""
  exit_on_whitelist_exceptions:
    description: "Exit with error when whitelist exceptions are detected (directly passed to get-sessions)"
    required: false
    default: "true"
  exit_on_blacklisted_sessions:
    description: "Exit with error when blacklisted sessions are detected (directly passed to get-sessions)"
    required: false
    default: "false"
  exit_on_anomalous_sessions:
    description: "Exit with error when anomalous sessions are detected (directly passed to get-sessions)"
    required: false
    default: "false"
  vulnerability_detection:
    description: "[Legacy alias of attack_pattern_detection] Start the runtime attack pattern detector during setup. Prefer attack_pattern_detection in new workflows; vulnerability_detection will be deprecated in a future major version."
    required: false
    default: "false"
  vulnerability_detection_interval:
    description: "[Legacy alias of attack_pattern_detection_interval] Runtime attack pattern detector tick interval in seconds. Prefer attack_pattern_detection_interval."
    required: false
    default: "60"
  dump_vulnerability_findings:
    description: "[Legacy alias of dump_attack_pattern_findings] Dump runtime attack pattern detector status/findings during a later action invocation. Prefer dump_attack_pattern_findings."
    required: false
    default: "false"
  exit_on_vulnerability_findings:
    description: "[Legacy alias of exit_on_attack_pattern_findings] Exit with error when active HIGH/CRITICAL runtime attack pattern findings first seen after this job's setup are detected. Prefer exit_on_attack_pattern_findings."
    required: false
    default: "true"
  # ---------------------------------------------------------------------------
  # Attack Pattern Detector inputs (preferred names; transition surface).
  # Defaults are empty strings so the alias fallback expression
  # `(inputs.attack_pattern_X || inputs.vulnerability_X)` falls through to the
  # legacy input when the new name is not explicitly set. The legacy
  # `vulnerability_*` inputs above remain accepted for backward compatibility
  # and will be deprecated in a future major version. See the workspace rules
  # (Vulnerability -> Attack Pattern Detection Terminology Transition) for the
  # full policy.
  # ---------------------------------------------------------------------------
  attack_pattern_detection:
    description: "Start the runtime attack pattern detector during setup. Preferred name; supersedes vulnerability_detection."
    required: false
    default: ""
  attack_pattern_detection_interval:
    description: "Runtime attack pattern detector tick interval in seconds. Preferred name; supersedes vulnerability_detection_interval."
    required: false
    default: ""
  dump_attack_pattern_findings:
    description: "Dump runtime attack pattern detector status/findings during a later action invocation. Preferred name; supersedes dump_vulnerability_findings."
    required: false
    default: ""
  exit_on_attack_pattern_findings:
    description: "Exit with error when active HIGH/CRITICAL runtime attack pattern findings first seen after this job's setup are detected; findings an earlier job left active (a persistent self-hosted runner) are printed as warnings. Preferred name; supersedes exit_on_vulnerability_findings."
    required: false
    default: ""
  dump_attack_pattern_trace:
    description: |
      Dump the latest VulnerabilityDebugTrace JSON during a later action invocation,
      and upload it as the `edamame-fp-capture` GitHub artifact. The artifact is
      the canonical CI input for `tools/ingest_ci_fp_corpus.sh`, which shapes
      it into Shape A entries under `edamame_core/tests/fp_corpus/<FP-ID>/`
      (FP replay corpus -- see `edamame_core/FPREPLAY.md`). Requires a posture
      binary that exposes `attack-pattern-debug-trace --latest` (edamame_posture
      >= 1.3.18+); older binaries will print a clap usage error and the step
      will fail soft -- inspect the runner log to confirm.
    required: false
    default: "false"
  file_monitoring:
    description: "Enable file integrity monitoring during the workflow"
    required: false
    default: "false"
  file_monitoring_paths:
    description: "Comma-separated paths to monitor (default: workspace + temp dirs)"
    required: false
    default: ""
  check_file_tampering:
    description: "Report file integrity monitoring events in the dump step"
    required: false
    default: "false"
  exit_on_file_tampering:
    description: "Exit with error when suspicious file events are detected"
    required: false
    default: "false"
  report_email:
    description: "Report email address"
    required: false
    default: ""
  create_custom_whitelists:
    description: "Create custom whitelists from captured network sessions and save it to the specified path"
    required: false
    default: "false"
  include_process_in_whitelist:
    description: "Include process names in whitelist entries for stricter matching. When enabled, connections from different processes to the same endpoint are treated separately."
    required: false
    default: "false"
  custom_whitelists_path:
    description: "Path to save or load custom whitelists JSON (used with create_custom_whitelists or to provide a whitelist file to apply)"
    required: false
    default: ""
  set_custom_whitelists:
    description: "Apply custom whitelists from a file specified in custom_whitelists_path"
    required: false
    default: "false"
  augment_custom_whitelists:
    description: "Augment the existing custom whitelists using current network sessions and merge the result back into the file specified by custom_whitelists_path. Requires network_scan=true."
    required: false
    default: "false"
  auto_whitelist:
    description: |
      Learn this runner pool's egress whitelist across runs, then enforce it.
      Requires packet capture (network_scan or packet_capture) and, in organizations
      with an IP allow list, wait_for_api so the job can read and write artifacts.

      Two invocations in the same job:
      1. Setup (auto_whitelist: true): takes the pool's whitelist from the newest
         artifact of an earlier run of the same workflow on the same branch (never a
         fork, never a pull_request_target or workflow_run trigger), and decides this
         run's mode from the state it was saved with.
      2. Teardown (dump_sessions_log: true):
         - enforcing (the whitelist saw nothing new for auto_whitelist_stability_consecutive_runs
           runs, or auto_whitelist_max_iterations learning runs passed): this job's egress
           traffic is checked against the whitelist; a new endpoint fails the job and is
           not learned (unless promote_exceptions is true);
         - learning: this job's traffic is added, and a run that saw nothing new counts
           toward stability.
      Any failure to list or download the artifact fails the job; only an answered
      listing without an eligible artifact starts a new whitelist.
    required: false
    default: "false"
  auto_whitelist_artifact_name:
    description: |
      Name of this runner pool's whitelist artifact (default: edamame-auto-whitelist).
      Use the job's runs-on label: edamame-auto-whitelist-<matrix.runs-on>, or the literal
      label for a fixed runs-on. The action appends the runner OS and architecture
      (edamame-auto-whitelist-ubuntu-latest-linux-x64), so pools never share a whitelist
      across operating systems. Artifacts are read only from earlier runs of the same
      workflow on the same branch.
    required: false
    default: "edamame-auto-whitelist"
  auto_whitelist_stability_threshold:
    description: "A learning run counts as stable when it saw no endpoint outside the whitelist (default 0). A value above 0 also counts a run whose additions stay at or under that percentage of the whitelist's entries."
    required: false
    default: "0"
  auto_whitelist_stability_consecutive_runs:
    description: "Consecutive stable learning runs after which the whitelist is enforced (default: 3)"
    required: false
    default: "3"
  auto_whitelist_max_iterations:
    description: "Learning runs after which the whitelist is enforced as it stands even if it has not settled (default: 25); the job warns when that happens"
    required: false
    default: "25"
  auto_whitelist_state_artifact_name:
    description: "Deprecated and ignored: the auto-whitelist state travels in the whitelist artifact."
    required: false
    default: "auto-whitelist-state"
  promote_exceptions:
    description: |
      At the auto-whitelist teardown of an enforcing run, add the endpoints outside the
      whitelist to it instead of failing the job. They are added without review: the job
      warns, lists them, and saves them as auto_whitelist_added.json in the artifact.
      Meant for a deliberate one-off (pass it from a repository variable you reset right
      after); leaving it on turns enforcement off.
    required: false
    default: "false"
  include_local_traffic:
    description: "Include local traffic in network capture and session logs"
    required: false
    default: "false"
  agentic_mode:
    description: "AI assistant mode for automated security todo processing: auto (execute), analyze (recommendations only), disabled (leave the daemon's persisted agentic state as it is), or off (turn agentic protection off: the Assistant, attack pattern detection and divergence detection; requires edamame_posture >= 2.0.2)"
    required: false
    default: "disabled"
  agentic_provider:
    description: "LLM provider for AI assistant: edamame (recommended), claude, openai (all use EDAMAME_LLM_API_KEY env), ollama (uses EDAMAME_LLM_BASE_URL env), or none"
    required: false
    default: "none"
  agentic_interval:
    description: "Interval in seconds for automated AI assistant todo processing"
    required: false
    default: "3600"
  adjudication_mode:
    description: "How the attack pattern detector publishes when the LLM adjudicator is absent: llm (default: a tick the LLM did not answer is withheld), advisory (publish the deterministic result when the LLM fails or is not configured), deterministic (never consult the LLM; strict gating then needs no LLM provider or key). Requires edamame_posture >= the release carrying vulnerability-adjudication-mode; the default value issues no command."
    required: false
    default: "llm"
  stop:
    description: "Stop the EDAMAME Posture process"
    required: false
    default: "false"
  display_logs:
    description: "Dump the EDAMAME daemon's rolling log files (/var/log/edamame/edamame_*_<pid>.YYYY-MM-DD on Unix, beside the binary on Windows) to the job log AND copy them to $RUNNER_TEMP/edamame-daemon-logs/. Path is exported as EDAMAME_DAEMON_LOGS_PATH for downstream actions/upload-artifact steps."
    required: false
    default: "false"
  debug:
    description: "Debug mode: debug logging and debug builds (install.sh --debug-build; on macOS the debug PKG, which needs an installer from edamame_posture >= 2.0.3: an older one installs the release PKG)"
    required: false
    default: "false"
  get_device_info:
    description: "Display device info including eBPF support status (Linux only)"
    required: false
    default: "false"
  verify_ebpf:
    description: "Verify eBPF is properly embedded in the binary. Fails if eBPF was not compiled in (build failure). Runtime restrictions (kernel settings, containers) are acceptable and won't fail. Implies get_device_info=true. (Linux only)"
    required: false
    default: "false"

outputs:
  ebpf_status:
    description: "eBPF support status: enabled, disabled_build, disabled_runtime, not_supported, or unknown"
    value: ${{ steps.device_info.outputs.ebpf_status }}
  ebpf_message:
    description: "Human-readable eBPF status message"
    value: ${{ steps.device_info.outputs.ebpf_message }}

runs:
  using: "composite"

  steps:
    # A wedged cancel on a self-hosted Windows runner can skip the runner's
    # post-job cleanup, and then the job's posture daemon and the processes it
    # started live on into later jobs. Before this job's first setup, kill what
    # earlier jobs left behind. Process-only: no file and no service is touched.
    # A process is killed only when all of these hold:
    #   - it was created before this job's Runner.Worker, so it is never one of
    #     this job's own processes, and it is not in this step's own chain
    #     (Runner.Worker, Runner.Listener, run.cmd, the wrapper that started it);
    #   - it is an edamame_posture, or its image or command line is under this
    #     runner's directory or work directory;
    #   - it is an orphan of an earlier job: going up its live parents never
    #     reaches a runner process (another runner's job), a service, a
    #     scheduled task, WMI or a logon or SSH session (what an operator or
    #     the host started is left alone).
    - name: Kill processes left by earlier jobs (Windows self-hosted runner)
      if: >
        runner.os == 'Windows' &&
        runner.environment == 'self-hosted' &&
        env.EDAMAME_POSTURE_SETUP_TIME == '' &&
        inputs.stop != 'true' &&
        inputs.dump_sessions_log != 'true' &&
        (inputs.dump_attack_pattern_findings || inputs.dump_vulnerability_findings) != 'true' &&
        inputs.dump_attack_pattern_trace != 'true' &&
        inputs.edamame_policy == '' &&
        inputs.edamame_minimum_score == '' &&
        inputs.create_custom_whitelists != 'true' &&
        inputs.augment_custom_whitelists != 'true'
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        try {
          $all = @(Get-CimInstance -ClassName Win32_Process -Property ProcessId,ParentProcessId,CreationDate,Name,ExecutablePath,CommandLine)
          $byPid = @{}
          foreach ($p in $all) { $byPid[[int]$p.ProcessId] = $p }

          # The live parent, or $null when it is gone. A parent id held by a
          # process created after the child is a reused id, not the parent.
          function Get-LiveParent($p) {
            $parentId = [int]$p.ParentProcessId
            if ($parentId -eq [int]$p.ProcessId) { return $null }
            $parent = $byPid[$parentId]
            if (-not $parent) { return $null }
            if ($null -ne $parent.CreationDate -and $null -ne $p.CreationDate -and $parent.CreationDate -gt $p.CreationDate) { return $null }
            return $parent
          }
          function Get-Utc($date) {
            if ($null -eq $date) { return '?' }
            return $date.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          function Get-ParentDir($path) {
            $trimmed = ([string]$path).TrimEnd('\')
            $i = $trimmed.LastIndexOf('\')
            if ($i -le 0) { return $null }
            return $trimmed.Substring(0, $i)
          }

          # This step's own chain, up to the runner and the wrapper that started it.
          $chain = New-Object 'System.Collections.Generic.HashSet[int]'
          $worker = $null
          $node = $byPid[[int]$PID]
          for ($depth = 0; $node -and $depth -lt 64; $depth++) {
            [void]$chain.Add([int]$node.ProcessId)
            if (-not $worker -and $node.Name -ieq 'Runner.Worker.exe') { $worker = $node }
            $node = Get-LiveParent $node
          }
          if (-not $worker -or $null -eq $worker.CreationDate) {
            Write-Host "Leftover process check skipped: this step does not run under a Runner.Worker."
            exit 0
          }
          $jobStart = $worker.CreationDate

          # This runner's directory (<runner>\bin\Runner.Worker.exe) and work
          # directory (the parent of RUNNER_WORKSPACE). A directory holding the
          # drive root, the profile, Windows, Program Files or ProgramData says
          # nothing about which job started a process and is not used.
          $broad = @($env:SystemDrive, $env:USERPROFILE, $env:SystemRoot, $env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:ProgramData) |
            Where-Object { $_ } | ForEach-Object { $_.TrimEnd('\') + '\' }
          $candidateRoots = @()
          if ($worker.ExecutablePath) { $candidateRoots += Get-ParentDir (Get-ParentDir $worker.ExecutablePath) }
          if ($env:RUNNER_WORKSPACE) { $candidateRoots += Get-ParentDir $env:RUNNER_WORKSPACE }
          $roots = @()
          foreach ($r in $candidateRoots) {
            if (-not $r -or $r.Length -le 3) { continue }
            $r = $r.TrimEnd('\') + '\'
            $tooBroad = $false
            foreach ($b in $broad) {
              if ($b.StartsWith($r, [StringComparison]::OrdinalIgnoreCase)) { $tooBroad = $true }
            }
            if (-not $tooBroad -and $roots -notcontains $r) { $roots += $r }
          }
          Write-Host "This job started at $(Get-Utc $jobStart) (Runner.Worker PID $($worker.ProcessId)); runner directories: $($roots -join ', ')"

          function Test-FromRunnerDirs($p) {
            $image = [string]$p.ExecutablePath
            $cmd = ([string]$p.CommandLine).Replace('/', '\')
            foreach ($r in $roots) {
              if ($image.StartsWith($r, [StringComparison]::OrdinalIgnoreCase)) { return $true }
              if ($cmd.IndexOf($r, [StringComparison]::OrdinalIgnoreCase) -ge 0) { return $true }
            }
            return $false
          }
          # Who started a process that is not an earlier job's: a runner (another
          # runner's job), a service, a scheduled task, WMI, a logon or SSH session.
          $launchers = @('runner.worker.exe', 'runner.listener.exe', 'services.exe', 'svchost.exe',
            'taskhostw.exe', 'taskeng.exe', 'wmiprvse.exe', 'explorer.exe', 'userinit.exe',
            'winlogon.exe', 'wininit.exe', 'csrss.exe', 'smss.exe', 'lsass.exe', 'sshd.exe', 'system')
          function Get-Launcher($p) {
            $a = Get-LiveParent $p
            for ($depth = 0; $a -and $depth -lt 64; $depth++) {
              if ([int]$a.ProcessId -le 4 -or $launchers -contains ([string]$a.Name).ToLowerInvariant()) { return $a }
              $a = Get-LiveParent $a
            }
            return $null
          }

          $killed = 0
          $failed = 0
          foreach ($p in $all) {
            $id = [int]$p.ProcessId
            if ($id -le 4 -or $chain.Contains($id)) { continue }
            if ($null -eq $p.CreationDate -or $p.CreationDate -ge $jobStart) { continue }
            if ([string]$p.Name -like 'Runner.*') { continue }
            if (-not ($p.Name -ieq 'edamame_posture.exe' -or (Test-FromRunnerDirs $p))) { continue }
            $what = "PID $id $($p.Name) (started $(Get-Utc $p.CreationDate), parent PID $($p.ParentProcessId), image $($p.ExecutablePath))"
            $launcher = Get-Launcher $p
            if ($launcher) {
              Write-Host "Left alone, started under $($launcher.Name) (PID $($launcher.ProcessId)): $what"
              continue
            }
            # Same PID and creation time: still the process examined above.
            $again = Get-CimInstance -ClassName Win32_Process -Filter "ProcessId = $id" -Property CreationDate -ErrorAction SilentlyContinue
            if (-not $again -or $again.CreationDate -ne $p.CreationDate) { continue }
            try {
              Stop-Process -Id $id -Force
              $killed++
              Write-Host "Killed $what"
            } catch {
              $failed++
              Write-Host "::warning::Could not kill $what : $($_.Exception.Message)"
            }
          }
          if ($killed -eq 0 -and $failed -eq 0) {
            Write-Host "No process left by an earlier job."
          } else {
            Write-Host "Killed $killed process(es) left by earlier jobs; $failed could not be killed."
          }
        } catch {
          Write-Host "::warning::Leftover process check stopped: $($_.Exception.Message)"
        }
        exit 0

    # The attack pattern gate of this job fails only on findings first seen
    # after its setup. Recorded once per job, at the first setup invocation.
    - name: Record this job's setup time
      id: setup_scope
      if: >
        env.EDAMAME_POSTURE_SETUP_TIME == '' &&
        inputs.stop != 'true' &&
        inputs.dump_sessions_log != 'true' &&
        (inputs.dump_attack_pattern_findings || inputs.dump_vulnerability_findings) != 'true' &&
        inputs.dump_attack_pattern_trace != 'true' &&
        inputs.edamame_policy == '' &&
        inputs.edamame_minimum_score == '' &&
        inputs.create_custom_whitelists != 'true' &&
        inputs.augment_custom_whitelists != 'true'
      shell: bash
      run: |
        SETUP_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        echo "EDAMAME_POSTURE_SETUP_TIME=$SETUP_TIME" >> "$GITHUB_ENV"
        echo "first_setup=true" >> "$GITHUB_OUTPUT"
        echo "This job's setup started at $SETUP_TIME"

    - name: Dependencies
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          cd
          # Install gh, wget, curl, jq using Chocolatey if not already installed
          # Check command availability first (gh may be pre-installed on hosted runners outside Chocolatey)
          if ! command -v gh &> /dev/null && ! choco list | grep -E '^gh[[:space:]]'; then
            echo "Installing gh..."
            choco install gh -y
          else
            echo "gh is already available: $(gh --version | head -1)"
          fi

          if ! command -v wget &> /dev/null && ! choco list | grep -E '^wget[[:space:]]'; then
            echo "Installing wget..."
            choco install wget -y | grep -v "Progress:"
          fi

          if ! command -v curl &> /dev/null && ! choco list | grep -q '^curl[[:space:]]'; then
            echo "Installing curl..."
            choco install curl -y | grep -v "Progress:"
          fi

          if ! command -v jq &> /dev/null && ! choco list | grep -q '^jq[[:space:]]'; then
            echo "Installing jq..."
            choco install jq -y | grep -v "Progress:"
          fi

          if ! command -v node &> /dev/null && ! choco list | grep -q '^nodejs[[:space:]]'; then
            echo "Installing nodejs..."
            choco install nodejs -y | grep -v "Progress:"
          fi

          if ! choco list | grep -q '^vcredist2015[[:space:]]'; then
            echo "Installing vcredist2015..."
            choco install vcredist2015 --package-parameters "/install /quiet /norestart" -y | grep -v "Progress:"
          fi
        elif [[ "$RUNNER_OS" == "Linux" ]]; then
          # Check if this is Alpine Linux
          if command -v apk &> /dev/null || [ -f /etc/alpine-release ]; then
            echo "Detected Alpine Linux, using apk for dependencies..."
            
            # Install required packages with apk
            NEED_PACKAGE_INSTALL="false"
            command -v git &> /dev/null || NEED_PACKAGE_INSTALL="true"
            command -v curl &> /dev/null || NEED_PACKAGE_INSTALL="true"
            command -v wget &> /dev/null || NEED_PACKAGE_INSTALL="true"
            command -v jq &> /dev/null || NEED_PACKAGE_INSTALL="true"
            command -v node &> /dev/null || NEED_PACKAGE_INSTALL="true"
            command -v gh &> /dev/null || NEED_PACKAGE_INSTALL="true"
            
            if [[ "$NEED_PACKAGE_INSTALL" == "true" ]]; then
              echo "Installing missing tools via apk..."
              
              # Update apk cache if needed
              apk update 2>/dev/null || sudo apk update 2>/dev/null || true
              
              # Install packages (apk handles missing packages gracefully)
              APK_PACKAGES=""
              command -v git &> /dev/null || APK_PACKAGES="$APK_PACKAGES git"
              command -v curl &> /dev/null || APK_PACKAGES="$APK_PACKAGES curl"
              command -v wget &> /dev/null || APK_PACKAGES="$APK_PACKAGES wget"
              command -v jq &> /dev/null || APK_PACKAGES="$APK_PACKAGES jq"
              command -v node &> /dev/null || APK_PACKAGES="$APK_PACKAGES nodejs npm"
              command -v gh &> /dev/null || APK_PACKAGES="$APK_PACKAGES github-cli"
              
              if [[ -n "$APK_PACKAGES" ]]; then
                echo "Installing:$APK_PACKAGES"
                apk add --no-cache $APK_PACKAGES 2>/dev/null || sudo apk add --no-cache $APK_PACKAGES
              fi
            else
              echo "All required tools present on Alpine, skipping apk install"
            fi
            # No need to ensure GTK3 runtime libraries are present as we don't link it to the musl bin that must be static and gtk can't be static
          else
            # Debian/Ubuntu-based Linux
            # Define function to wait for apt/dpkg locks
          wait_for_apt_locks() {
            echo "Checking for apt/dpkg locks..."
            local TIMEOUT=300
            local TIME_PASSED=0
            local LOCK_FILES=(
              "/var/lib/apt/lists/lock"
              "/var/lib/dpkg/lock-frontend"
              "/var/lib/dpkg/lock"
              "/var/cache/apt/archives/lock"
            )
            
            while [ $TIME_PASSED -lt $TIMEOUT ]; do
              local LOCKED=false
              local HAS_LOCK_CHECKER=false
              
              # Method 1: Check with fuser if available
              if command -v fuser >/dev/null 2>&1; then
                HAS_LOCK_CHECKER=true
                for lock_file in "${LOCK_FILES[@]}"; do
                  if [ -f "$lock_file" ] && sudo fuser "$lock_file" >/dev/null 2>&1; then
                    LOCKED=true
                    echo "  Lock held: $lock_file (by process $(sudo fuser "$lock_file" 2>/dev/null))"
                    break
                  fi
                done
              fi
              
              # Method 2: Check with lsof as fallback
              if [ "$LOCKED" = "false" ] && command -v lsof >/dev/null 2>&1; then
                HAS_LOCK_CHECKER=true
                for lock_file in "${LOCK_FILES[@]}"; do
                  if [ -f "$lock_file" ] && sudo lsof "$lock_file" >/dev/null 2>&1; then
                    LOCKED=true
                    echo "  Lock held (lsof): $lock_file"
                    break
                  fi
                done
              fi
              
              # If no lock checker is available, just proceed
              # (apt will fail with a clear error if there's actually a lock)
              if [ "$HAS_LOCK_CHECKER" = "false" ]; then
                echo "No lock checker (fuser/lsof) available, proceeding..."
                return 0
              fi
              
              if [ "$LOCKED" = "false" ]; then
                echo "No apt/dpkg locks held, proceeding..."
                return 0
              fi
              
              echo "Waiting for apt/dpkg locks to be released... ($TIME_PASSED/${TIMEOUT}s)"
              sleep 5
              TIME_PASSED=$((TIME_PASSED + 5))
            done
            
            echo "Timed out waiting for apt/dpkg locks after $TIMEOUT seconds."
            return 1
          }
          
          export DEBIAN_FRONTEND=noninteractive
          apt_cmd_with_retry() {
            local max_attempts=10
            local delay_seconds=5
            local attempt=1
            local cmd=("$@")
            local refreshed="false"
            local out_log
            out_log=$(mktemp)

            while true; do
              echo "Running: ${cmd[*]} (attempt $attempt/$max_attempts)"

              if ! wait_for_apt_locks; then
                echo "Failed to acquire locks, retrying..."
                sleep $delay_seconds
                attempt=$((attempt + 1))
                if (( attempt > max_attempts )); then
                  echo "Command failed after $max_attempts attempts: ${cmd[*]}"
                  rm -f "$out_log"
                  return 1
                fi
                continue
              fi

              # Capture combined output so the failure can be classified while still
              # streaming it live. PIPESTATUS[0] holds the apt command's real exit code.
              if "${cmd[@]}" 2>&1 | tee "$out_log"; then
                rm -f "$out_log"
                return 0
              fi
              local exit_code=${PIPESTATUS[0]}

              # dpkg interrupted -> repair before retry.
              if [ "$exit_code" -eq 100 ]; then
                echo "dpkg was interrupted, running dpkg --configure -a..."
                sudo dpkg --configure -a || true
              fi

              # Transient index/staleness class: a stale or partially-fetched local
              # package index cannot be fixed by re-running the SAME command against
              # it (this is the recurring container-apt "papered over with retries"
              # failure). Clean + re-fetch the index, then retry. "Unable to locate
              # package" on the well-known packages this action installs is almost
              # always a stale index, so it is treated as an index-refresh trigger
              # rather than a permanent error -- unless it survives a SUCCESSFUL
              # refresh (below), at which point it is genuinely missing.
              if grep -qE 'Hash Sum mismatch|Failed to fetch|Unable to fetch some archives|is not signed|GPG error|NO_PUBKEY|The following signatures were invalid|File has unexpected size|404( +| +Not Found|  Not Found)|Could not resolve|Temporary failure resolving|Undetermined error|Mirror sync in progress|Unable to locate package|has no installation candidate' "$out_log"; then
                if [ "$refreshed" == "true" ] && grep -qE 'Unable to locate package|has no installation candidate' "$out_log"; then
                  echo "Package still not found after a successful index refresh; treating as permanent (not retrying): ${cmd[*]}"
                  rm -f "$out_log"
                  return "$exit_code"
                fi
                echo "Transient apt index issue detected; cleaning and refreshing package index before retry..."
                sudo apt-get clean || true
                sudo rm -rf /var/lib/apt/lists/* || true
                wait_for_apt_locks || true
                if sudo -E apt-get update -y; then
                  refreshed="true"
                fi
              fi

              if (( attempt >= max_attempts )); then
                echo "Command failed after $max_attempts attempts: ${cmd[*]}"
                rm -f "$out_log"
                return "$exit_code"
              fi

              echo "Command failed with exit code $exit_code (attempt $attempt/$max_attempts). Retrying in $delay_seconds seconds..."
              sleep $delay_seconds
              attempt=$((attempt + 1))
            done
          }
          
          # Initial wait for any background apt processes (unattended-upgrades, etc.)
          echo "Waiting for any background apt processes to complete..."
          wait_for_apt_locks
          
          # Install sudo if needed
          if ! command -v sudo &> /dev/null; then
            echo "Installing sudo..."
            apt_cmd_with_retry apt-get install -y --no-install-recommends sudo
          fi          
          # Update package lists only if tools need to be installed
          # Skip on non-setup operations to avoid unnecessary lock contention
          NEED_PACKAGE_INSTALL="false"
          command -v git &> /dev/null || NEED_PACKAGE_INSTALL="true"
          command -v wget &> /dev/null || NEED_PACKAGE_INSTALL="true"
          command -v gh &> /dev/null || NEED_PACKAGE_INSTALL="true"
          command -v curl &> /dev/null || NEED_PACKAGE_INSTALL="true"
          command -v jq &> /dev/null || NEED_PACKAGE_INSTALL="true"
          command -v bc &> /dev/null || NEED_PACKAGE_INSTALL="true"
          command -v node &> /dev/null || NEED_PACKAGE_INSTALL="true"
          
          if [[ "$NEED_PACKAGE_INSTALL" == "true" ]]; then
            echo "Updating package lists (tools missing)..."
            apt_cmd_with_retry sudo -E apt-get update -y
          else
            echo "All required tools present, skipping apt update"
          fi

          # Check/install git
          if ! command -v git &> /dev/null; then
            echo "Installing git..."
            apt_cmd_with_retry sudo -E apt-get install -y git
          fi

          # Check/install wget (needed for GitHub CLI repository setup)
          if ! command -v wget &> /dev/null; then
            echo "Installing wget..."
            apt_cmd_with_retry sudo -E apt-get install -y wget
          fi

          # Check/install gh
          if ! command -v gh &> /dev/null; then
            echo "Installing gh..."
            sudo mkdir -p -m 755 /etc/apt/keyrings
            GH_KEY_TMP=$(mktemp)
            wget -nv -O "$GH_KEY_TMP" https://cli.github.com/packages/githubcli-archive-keyring.gpg
            sudo install -m 644 "$GH_KEY_TMP" /etc/apt/keyrings/githubcli-archive-keyring.gpg
            rm -f "$GH_KEY_TMP"
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt_cmd_with_retry sudo -E apt-get update -y
            apt_cmd_with_retry sudo -E apt-get install -y gh
          fi

          # Check/install curl
          if ! command -v curl &> /dev/null; then
            echo "Installing curl..."
            apt_cmd_with_retry sudo -E apt-get install -y curl
          fi

          # Check/install jq
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            apt_cmd_with_retry sudo -E apt-get install -y jq
          fi

          # Check/install bc (needed for auto-whitelist floating-point comparisons)
          if ! command -v bc &> /dev/null; then
            echo "Installing bc..."
            apt_cmd_with_retry sudo -E apt-get install -y bc
          fi


          # Check/install node + npm
          if ! command -v node &> /dev/null; then
            echo "Installing node + npm..."
            apt_cmd_with_retry sudo -E apt-get install -y nodejs npm
          fi

          # Ensure GTK3 runtime libraries are present (required by edamame_posture daemon)
          if ! ldconfig -p 2>/dev/null | grep -q libgtk-3; then
            echo "Installing GTK3 runtime libraries..."
            if [[ "$NEED_PACKAGE_INSTALL" != "true" ]]; then
              apt_cmd_with_retry sudo -E apt-get update -y
            fi
            apt_cmd_with_retry sudo -E apt-get install -y libgtk-3-0
          fi
          fi  # Close Alpine detection if block
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          # Check/install gh
          if ! command -v gh &> /dev/null; then
            echo "Installing gh..."
            brew install gh
          fi

          # Check/install wget
          if ! command -v wget &> /dev/null; then
            echo "Installing wget..."
            brew install wget
          fi

          # Check/install curl
          if ! command -v curl &> /dev/null; then
            echo "Installing curl..."
            brew install curl
          fi

          # Check/install jq
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            brew install jq
          fi

          # Check/install node
          if ! command -v node &> /dev/null; then
            echo "Installing node..."
            brew install node
          fi
        else
          echo "Unsupported OS: $RUNNER_OS"
          exit 1
        fi
      shell: bash

    - name: Pre-create EDAMAME log directory (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        sudo mkdir -p /var/log/edamame
        sudo chmod 1777 /var/log/edamame

    - name: Validate strict vulnerability gate configuration
      if: ${{ (inputs.attack_pattern_detection || inputs.vulnerability_detection) == 'true' && (inputs.exit_on_attack_pattern_findings || inputs.exit_on_vulnerability_findings) == 'true' && inputs.dump_sessions_log != 'true' && (inputs.dump_attack_pattern_findings || inputs.dump_vulnerability_findings) != 'true' && inputs.stop != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mode="${{ inputs.agentic_mode }}"
        provider="${{ inputs.agentic_provider }}"
        adjudication_mode="${{ inputs.adjudication_mode }}"

        # advisory / deterministic publish the deterministic result without an
        # adjudicator, so the gate has findings to read whether or not an LLM
        # is reachable; the LLM prerequisites below are for `llm` only.
        if [[ -n "$adjudication_mode" && "$adjudication_mode" != "llm" ]]; then
          echo "[OK] Strict vulnerability gate runs on deterministic publication (adjudication_mode=$adjudication_mode); no LLM prerequisite."
          exit 0
        fi

        if [[ -z "$mode" || "$mode" == "disabled" || "$mode" == "off" ]]; then
          echo "::error::Strict vulnerability gating requires agentic_mode=analyze or agentic_mode=auto so LLM adjudication is active (or set adjudication_mode to advisory/deterministic)."
          exit 1
        fi

        if [[ -z "$provider" || "$provider" == "none" ]]; then
          echo "::error::Strict vulnerability gating requires agentic_provider=edamame, claude, openai, or ollama."
          exit 1
        fi

        case "$provider" in
          edamame|claude|openai)
            if [[ -z "${EDAMAME_LLM_API_KEY:-}" ]]; then
              echo "::error::Strict vulnerability gating with provider '$provider' requires EDAMAME_LLM_API_KEY."
              exit 1
            fi
            ;;
          ollama)
            if [[ -z "${EDAMAME_LLM_BASE_URL:-}" ]]; then
              echo "::error::Strict vulnerability gating with provider 'ollama' requires EDAMAME_LLM_BASE_URL."
              exit 1
            fi
            ;;
          *)
            echo "::error::Unsupported agentic_provider '$provider' for strict vulnerability gating."
            exit 1
            ;;
        esac

        echo "[OK] Strict vulnerability gate will run with LLM adjudication: mode=$mode provider=$provider"

    - name: Install or Update EDAMAME Posture
      id: install_posture
      # Skip the installer entirely for non-setup operations (policy checks,
      # dump_sessions_log, dump_vulnerability_findings, stop, custom-whitelist ops).
      # install.sh performs an
      # unconditional binary-refresh-on-checksum-mismatch that would stop the
      # running daemon; stopping it during a post-step breaks downstream
      # verification because the same install.sh invocation would not restart
      # the daemon without credentials/network flags.
      #
      # The in-step IS_INITIAL_SETUP guard below is retained as defense in
      # depth: even if this step ever does run for a post-step operation
      # (e.g. a future condition is added to one side only), the installer
      # will still be invoked without credentials and without network flags.
      if: >
        inputs.stop != 'true' &&
        inputs.dump_sessions_log != 'true' &&
        (inputs.dump_attack_pattern_findings || inputs.dump_vulnerability_findings) != 'true' &&
        inputs.dump_attack_pattern_trace != 'true' &&
        inputs.edamame_policy == '' &&
        inputs.edamame_minimum_score == '' &&
        inputs.create_custom_whitelists != 'true' &&
        inputs.augment_custom_whitelists != 'true'
      shell: bash
      env:
        INSTALL_STATE_FILE: ${{ runner.temp }}/edamame_install_state
        # Secrets reach the script through the environment, never through
        # `${{ }}` interpolation into the script text (script injection) nor
        # the installer's argv (process list).
        EDAMAME_PIN_INPUT: ${{ inputs.edamame_pin }}
        ACTION_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        STATE_FILE="$INSTALL_STATE_FILE"
        INSTALL_ARGS=(--state-file "$STATE_FILE")
        PASS_PIN="false"
        
        # Only pass connection parameters on initial setup, not on subsequent operations
        # This prevents unnecessary daemon restarts when action is called for policy checks, etc.
        IS_INITIAL_SETUP="true"
        if [[ "${{ inputs.stop }}" == "true" || \
              "${{ inputs.dump_sessions_log }}" == "true" || \
              "${{ inputs.dump_attack_pattern_findings || inputs.dump_vulnerability_findings }}" == "true" || \
              "${{ inputs.dump_attack_pattern_trace }}" == "true" || \
              -n "${{ inputs.edamame_policy }}" || \
              -n "${{ inputs.edamame_minimum_score }}" || \
              "${{ inputs.create_custom_whitelists }}" == "true" || \
              "${{ inputs.augment_custom_whitelists }}" == "true" ]]; then
          IS_INITIAL_SETUP="false"
          echo "Detected non-setup operation - skipping credential pass to installer"
          echo "This prevents unnecessary daemon restarts that would lose captured sessions"
        fi
        
        # Add connection parameters only if this is initial setup
        if [[ "$IS_INITIAL_SETUP" == "true" ]]; then
          echo "Initial setup detected - passing credentials and network flags to installer"
          if [[ -n "${{ inputs.edamame_user }}" ]]; then
            INSTALL_ARGS+=(--user "${{ inputs.edamame_user }}")
          fi
          if [[ -n "${{ inputs.edamame_domain }}" ]]; then
            INSTALL_ARGS+=(--domain "${{ inputs.edamame_domain }}")
          fi
          # The PIN goes to the installer in EDAMAME_PIN (set at its exec
          # below), not in INSTALL_ARGS: argv is visible in the process list.
          if [[ -n "${EDAMAME_PIN_INPUT:-}" ]]; then
            PASS_PIN="true"
          fi
          
          # Add device ID with timestamp suffix for uniqueness
          if [[ -n "${{ inputs.edamame_id }}" ]]; then
            IDSUFFIX=$(node -e "console.log(Date.now())")
            INSTALL_ARGS+=(--device-id "${{ inputs.edamame_id }}_${IDSUFFIX}")
          fi
          
          # Add network monitoring flags (only on initial setup to persist in service config)
          if [[ "${{ inputs.network_scan }}" == "true" ]]; then
            INSTALL_ARGS+=(--start-lanscan)
          fi
          if [[ "${{ inputs.packet_capture }}" == "true" || ( "${{ inputs.packet_capture }}" == "auto" && "${{ inputs.network_scan }}" == "true" ) ]]; then
            INSTALL_ARGS+=(--start-capture)
          fi
        fi
        
        # Add whitelist configuration
        if [[ -n "${{ inputs.whitelist }}" ]]; then
          INSTALL_ARGS+=(--whitelist "${{ inputs.whitelist }}")
        fi
        if [[ "${{ inputs.check_whitelist }}" == "true" || -n "${{ inputs.whitelist }}" ]]; then
          INSTALL_ARGS+=(--fail-on-whitelist)
        fi
        if [[ "${{ inputs.check_blacklist }}" == "true" ]]; then
          INSTALL_ARGS+=(--fail-on-blacklist)
        fi
        if [[ "${{ inputs.attack_pattern_detection || inputs.vulnerability_detection }}" == "true" && "${{ inputs.exit_on_attack_pattern_findings || inputs.exit_on_vulnerability_findings }}" == "true" ]]; then
          INSTALL_ARGS+=(--fail-on-findings)
        fi
        if [[ "${{ inputs.cancel_on_violation }}" == "true" ]]; then
          INSTALL_ARGS+=(--cancel-on-violation)
          
          # Create cancellation script BEFORE install.sh runs
          # This ensures the script exists when install.sh starts the daemon (connected mode)
          # The same script is used for both connected and disconnected modes
          echo "[INFO] cancel_on_violation enabled - creating pipeline cancellation script"
          
          # Determine script path
          # The daemon runs with sudo (HOME=/root), so we need to create the script there
          if [[ -n "${{ inputs.cancel_pipeline_script }}" ]]; then
            CANCEL_SCRIPT_PATH="${{ inputs.cancel_pipeline_script }}"
          else
            # Use $HOME which matches the daemon's default lookup path
            # Since we use sudo -E, the daemon inherits the same HOME as the action
            CANCEL_SCRIPT_PATH="$HOME/cancel_pipeline.sh"
          fi
          
          echo "Creating cancellation script at: $CANCEL_SCRIPT_PATH"
          
          # Capture CI environment variables now (before sudo)
          CAPTURED_GITHUB_ACTIONS="${GITHUB_ACTIONS:-}"
          CAPTURED_GITHUB_RUN_ID="${GITHUB_RUN_ID:-}"
          CAPTURED_GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-}"
          CAPTURED_GITHUB_TOKEN="${ACTION_TOKEN:-}"
          CAPTURED_GITLAB_CI="${GITLAB_CI:-}"
          CAPTURED_CI_PROJECT_ID="${CI_PROJECT_ID:-}"
          CAPTURED_CI_PIPELINE_ID="${CI_PIPELINE_ID:-}"
          CAPTURED_GITLAB_TOKEN="${GITLAB_TOKEN:-}"
          CAPTURED_CI_JOB_TOKEN="${CI_JOB_TOKEN:-}"
          
          # Create cancellation script using printf
          # Write to $HOME which is accessible by current user (no sudo needed)
          # Note: Uses POSIX sh for portability, syncs after each log write
          # Log file includes run ID for non-ephemeral runners
          printf '#!/bin/sh\n# EDAMAME Pipeline Cancellation Script\nGITHUB_ACTIONS="%s"\nGITHUB_RUN_ID="%s"\nGITHUB_REPOSITORY="%s"\nGITHUB_TOKEN="%s"\nGITLAB_CI="%s"\nCI_PROJECT_ID="%s"\nCI_PIPELINE_ID="%s"\nGITLAB_TOKEN="%s"\nCI_JOB_TOKEN="%s"\nif [ -n "$GITHUB_RUN_ID" ]; then\n  LOGFILE="$HOME/cancel_pipeline_${GITHUB_RUN_ID}.log"\nelif [ -n "$CI_PIPELINE_ID" ]; then\n  LOGFILE="$HOME/cancel_pipeline_${CI_PIPELINE_ID}.log"\nelse\n  LOGFILE="$HOME/cancel_pipeline.log"\nfi\nlog() { echo "$1" >> "$LOGFILE"; sync 2>/dev/null; echo "$1"; }\nlog ""\nlog "========================================"\nlog "EDAMAME Pipeline Cancellation Script"\nlog "Timestamp: $(date +%%Y-%%m-%%dT%%H:%%M:%%S)"\nlog "========================================"\nREASON="${1:-Policy violation detected}"\nlog "Reason: $REASON"\nlog "GITHUB_ACTIONS=$GITHUB_ACTIONS"\nlog "GITHUB_RUN_ID=$GITHUB_RUN_ID"\nlog "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"\nlog "GITHUB_TOKEN length: ${#GITHUB_TOKEN}"\nlog "LOGFILE=$LOGFILE"\nif [ -n "$GITHUB_ACTIONS" ]; then\n  log "Detected GitHub Actions environment"\n  export GH_TOKEN="$GITHUB_TOKEN"\n  log "Executing: gh run cancel $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY"\n  sync 2>/dev/null\n  if gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" >> "$LOGFILE" 2>&1; then\n    log "[OK] Pipeline cancellation command succeeded"\n  else\n    log "[ERROR] Pipeline cancellation command failed with exit code: $?"\n  fi\nelif [ -n "$GITLAB_CI" ]; then\n  log "Detected GitLab CI environment"\n  TOKEN="${GITLAB_TOKEN:-$CI_JOB_TOKEN}"\n  curl -s -X POST -H "PRIVATE-TOKEN: $TOKEN" "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/cancel" >> "$LOGFILE" 2>&1\n  log "[OK] Pipeline cancellation command executed"\nelse\n  log "[ERROR] No CI environment detected"\n  exit 1\nfi\nlog "Script completed at: $(date +%%Y-%%m-%%dT%%H:%%M:%%S)"\nlog "========================================"\nsync 2>/dev/null\n' \
            "$CAPTURED_GITHUB_ACTIONS" "$CAPTURED_GITHUB_RUN_ID" "$CAPTURED_GITHUB_REPOSITORY" "$CAPTURED_GITHUB_TOKEN" \
            "$CAPTURED_GITLAB_CI" "$CAPTURED_CI_PROJECT_ID" "$CAPTURED_CI_PIPELINE_ID" "$CAPTURED_GITLAB_TOKEN" "$CAPTURED_CI_JOB_TOKEN" \
            > "$CANCEL_SCRIPT_PATH"
          
          chmod 700 "$CANCEL_SCRIPT_PATH"
          echo "[OK] Cancellation script created at $CANCEL_SCRIPT_PATH"
        fi
        if [[ "${{ inputs.include_local_traffic }}" == "true" ]]; then
          INSTALL_ARGS+=(--include-local-traffic)
        fi
        
        # Add agentic mode configuration
        if [[ "${{ inputs.agentic_mode }}" != "disabled" && "${{ inputs.agentic_mode }}" != "" ]]; then
          INSTALL_ARGS+=(--agentic-mode "${{ inputs.agentic_mode }}")
        fi
        if [[ "${{ inputs.agentic_provider }}" != "none" && "${{ inputs.agentic_provider }}" != "" ]]; then
          INSTALL_ARGS+=(--agentic-provider "${{ inputs.agentic_provider }}")
          # Log which provider is being used
          case "${{ inputs.agentic_provider }}" in
            edamame)
              echo "[OK] Using EDAMAME Portal LLM (requires EDAMAME_LLM_API_KEY env var)"
              ;;
            claude|openai)
              echo "[OK] Using BYOLLM provider: ${{ inputs.agentic_provider }} (requires EDAMAME_LLM_API_KEY env var)"
              ;;
            ollama)
              echo "[OK] Using local Ollama (requires EDAMAME_LLM_BASE_URL env var)"
              ;;
          esac
        fi
        if [[ "${{ inputs.agentic_interval }}" != "3600" && -n "${{ inputs.agentic_interval }}" ]]; then
          INSTALL_ARGS+=(--agentic-interval "${{ inputs.agentic_interval }}")
        fi
        
        # The debug build flag is decided once the installer is downloaded
        # (below): on macOS it depends on what that installer supports.

        # Platform-specific flags
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          INSTALL_ARGS+=(--install-dir "$HOME")
        fi
        
        echo "Running installer with args: ${INSTALL_ARGS[*]}"

        # Resolve the latest release tag (logged, and used by the release-pinned
        # fallback below).
        #
        # IMPORTANT: do NOT use api.github.com here. The edamametechnologies org has
        # an IP allow list enabled, and github-hosted runner pools (ubuntu-latest,
        # macos-latest, windows-latest, ubuntu-24.04-arm, ...) are NOT in that
        # allow list, so any api.github.com call returns HTTP 403. Even
        # authenticating with $GITHUB_TOKEN does NOT bypass the org IP allow list.
        # The standard "Setup EDAMAME Posture in connected mode" lift cannot help
        # here -- the lift requires `edamame_posture` to already be installed,
        # which is exactly what this step is trying to install (chicken-and-egg).
        #
        # The reliable cross-runner approach is the `github.com/<owner>/<repo>/
        # releases/latest` HTML redirect, which is served by github.com (not the
        # org-scoped api.github.com) and returns a 302 to the latest tag for any
        # public repo without auth and without hitting the IP allow list.
        #
        # The hardcoded default below MUST point at a recent release whose install.sh
        # contains the modern FALLBACK_VERSION / LATEST_RELEASE_TAG_SECONDARY logic and
        # whose CLI surface includes the modern subcommand aliases. v1.3.18 is the
        # earliest release that satisfies both constraints.
        INSTALL_SCRIPT_REF="v1.3.18"
        # Capture the GH token for the install.sh invocation later (belt-and-
        # suspenders so older installer code paths that still call
        # api.github.com authenticate at least). Used at the install.sh exec.
        GH_TOKEN_VALUE="${ACTION_TOKEN:-}"
        LATEST_REDIRECT_URL="https://github.com/edamametechnologies/edamame_posture_cli/releases/latest"
        echo "Determining latest installer release via redirect: $LATEST_REDIRECT_URL"
        LATEST_TAG=""
        REDIRECT_LOCATION=""
        REDIRECT_HTTP_CODE=""
        if command -v curl >/dev/null 2>&1; then
          # -I HEAD-only, -s silent, -o /dev/null discard body, -w write status,
          # capture the Location response header. Do NOT follow the redirect (-L)
          # because we want the redirect target, not the followed page.
          REDIRECT_TMP=$(mktemp)
          REDIRECT_HTTP_CODE=$(curl -sI -o "$REDIRECT_TMP" -w "%{http_code}" \
            "$LATEST_REDIRECT_URL" 2>/dev/null || echo "000")
          REDIRECT_LOCATION=$(grep -i '^location:' "$REDIRECT_TMP" | tail -1 \
            | sed -E 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r' || true)
          rm -f "$REDIRECT_TMP"
        elif command -v wget >/dev/null 2>&1; then
          # wget --server-response prints headers; --max-redirect=0 forces it to
          # treat the 302 as success and emit the Location header.
          REDIRECT_HEADERS=$(wget --max-redirect=0 --server-response -q -O /dev/null \
            "$LATEST_REDIRECT_URL" 2>&1 || true)
          REDIRECT_HTTP_CODE=$(echo "$REDIRECT_HEADERS" | awk '/HTTP\//{print $2}' | tail -1)
          REDIRECT_LOCATION=$(echo "$REDIRECT_HEADERS" | awk '/[Ll]ocation:/{print $2}' | tail -1 | tr -d '\r')
        fi
        if [[ "$REDIRECT_HTTP_CODE" =~ ^30[0-9]$ ]] && [[ -n "$REDIRECT_LOCATION" ]]; then
          # Extract the v<X.Y.Z> tag from the Location URL (e.g.
          # `https://github.com/.../releases/tag/v1.3.19` -> `v1.3.19`).
          LATEST_TAG=$(printf '%s\n' "$REDIRECT_LOCATION" | sed -nE 's@.*/releases/tag/(v[0-9][0-9.]*)/?$@\1@p')
          if [[ -n "$LATEST_TAG" ]]; then
            INSTALL_SCRIPT_REF="$LATEST_TAG"
          else
            echo "[WARNING] Could not parse tag from redirect Location: $REDIRECT_LOCATION"
          fi
        else
          echo "[WARNING] github.com /releases/latest redirect returned HTTP $REDIRECT_HTTP_CODE (location='$REDIRECT_LOCATION')"
          echo "[WARNING] Falling back to hardcoded INSTALL_SCRIPT_REF=$INSTALL_SCRIPT_REF"
        fi
        echo "Using installer reference for the release-pinned fallback: $INSTALL_SCRIPT_REF"

        # Download with retry logic for transient errors (502, 503, 504, 429, connection errors).
        # The last HTTP status is left in LAST_DOWNLOAD_HTTP_CODE so the caller can
        # tell a missing file (404) from a download that failed.
        LAST_DOWNLOAD_HTTP_CODE=""
        download_file_with_retry() {
          local url="$1"
          local destination="$2"
          local max_retries=5
          local retry_delay=2
          local attempt=1
          LAST_DOWNLOAD_HTTP_CODE=""

          while [ $attempt -le $max_retries ]; do
            echo "  Download attempt $attempt/$max_retries..."
            local http_code=""
            local exit_code=0
            
            if command -v curl >/dev/null 2>&1; then
              # Don't use -f so we can capture the actual HTTP code
              # -s: silent, -S: show errors, -L: follow redirects
              # -w: write HTTP code to stdout after content
              # -o: write content to file
              http_code=$(curl --proto '=https' --tlsv1.2 -sSL -w "%{http_code}" "$url" -o "$destination" 2>&1) || exit_code=$?
            elif command -v wget >/dev/null 2>&1; then
              # wget doesn't have easy HTTP code extraction, use --server-response
              if wget -q --server-response "$url" -O "$destination" 2>&1 | grep -q "200 OK"; then
                http_code="200"
              else
                exit_code=1
                # Try to extract status code from wget output
                http_code=$(wget -q --server-response "$url" -O /dev/null 2>&1 | awk '/HTTP\//{print $2}' | tail -1)
              fi
            else
              echo "  [ERROR] Neither curl nor wget available"
              return 1
            fi
            # The status code only (curl's error text, when there is one, comes first).
            LAST_DOWNLOAD_HTTP_CODE="${http_code##*[!0-9]}"

            # Check for success (HTTP 2xx)
            case "$http_code" in
              2*)
                if [ -s "$destination" ]; then
                  echo "  [OK] Download succeeded (HTTP $http_code)"
                  return 0
                else
                  echo "  [WARN] HTTP $http_code but file is empty"
                fi
                ;;
            esac
            
            # Check if it's a retryable error
            local should_retry=false
            case "$http_code" in
              429)
                echo "  [WARN] HTTP 429 (Rate limited) - retryable"
                should_retry=true
                ;;
              500)
                echo "  [WARN] HTTP 500 (Internal server error) - retryable"
                should_retry=true
                ;;
              502)
                echo "  [WARN] HTTP 502 (Bad gateway) - retryable"
                should_retry=true
                ;;
              503)
                echo "  [WARN] HTTP 503 (Service unavailable) - retryable"
                should_retry=true
                ;;
              504)
                echo "  [WARN] HTTP 504 (Gateway timeout) - retryable"
                should_retry=true
                ;;
              000|"")
                echo "  [WARN] Connection failed (no HTTP response) - retryable"
                should_retry=true
                ;;
              4*)
                echo "  [ERROR] HTTP $http_code (Client error) - not retryable"
                ;;
              *)
                if [ $exit_code -ne 0 ]; then
                  echo "  [WARN] Download failed (exit code: $exit_code, HTTP: $http_code) - retryable"
                  should_retry=true
                else
                  echo "  [ERROR] HTTP $http_code - not retryable"
                fi
                ;;
            esac
            
            if [ "$should_retry" = "true" ] && [ $attempt -lt $max_retries ]; then
              echo "  Waiting ${retry_delay}s before retry..."
              sleep $retry_delay
              retry_delay=$((retry_delay * 2))  # Exponential backoff: 2s, 4s, 8s, 16s, 32s
              attempt=$((attempt + 1))
              rm -f "$destination"  # Clean up partial download
            else
              if [ "$should_retry" = "true" ]; then
                echo "  [ERROR] Max retries ($max_retries) exceeded"
              fi
              rm -f "$destination"
              return 1
            fi
          done
          
          return 1
        }
        
        # Simple download without retry (for fallbacks)
        download_file() {
          local url="$1"
          local destination="$2"
          if command -v curl >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL "$url" -o "$destination"
          elif command -v wget >/dev/null 2>&1; then
            wget -q "$url" -O "$destination"
          else
            return 1
          fi
        }
        
        # Installer source, in this order:
        #   1. The latest release's install.sh asset: the installer published with
        #      the binaries and packages it installs (posture release_install.yml
        #      uploads it with a build-provenance attestation). A change pushed to
        #      install.sh on main reaches action users only once it is uploaded
        #      to a release, after install_compat has passed on it. Until then
        #      every push to main was live at once, ahead of the binary it would
        #      install (2026-09-28: a PIN handed over only in EDAMAME_PIN, which
        #      the released 2.0.1 ignored).
        #   2. Raw main, only when that asset is MISSING (HTTP 404: a new release
        #      whose installer is not uploaded yet). A download that failed for
        #      any other reason is not a missing asset, so it does not bring in
        #      an installer nobody released; it goes to 3.
        #   3. The release-pinned asset at INSTALL_SCRIPT_REF (the latest tag from
        #      the redirect above, or the hardcoded floor when the redirect
        #      failed).
        LATEST_ASSET_URL="https://github.com/edamametechnologies/edamame_posture_cli/releases/latest/download/install.sh"
        RAW_INSTALL_URL="https://raw.githubusercontent.com/edamametechnologies/edamame_posture_cli/main/install.sh"
        RELEASE_INSTALL_URL="https://github.com/edamametechnologies/edamame_posture_cli/releases/download/${INSTALL_SCRIPT_REF}/install.sh"
        TMP_INSTALL_SCRIPT=$(mktemp)
        DOWNLOAD_SOURCE=""

        echo "Attempting to download the latest release's installer: $LATEST_ASSET_URL"
        if download_file_with_retry "$LATEST_ASSET_URL" "$TMP_INSTALL_SCRIPT"; then
          DOWNLOAD_SOURCE="the install.sh asset of the latest release (${LATEST_TAG:-tag not resolved})"
        elif [[ "$LAST_DOWNLOAD_HTTP_CODE" == "404" ]]; then
          echo "[WARNING] The latest release has no install.sh asset (HTTP 404); using raw main."
          echo "Attempting to download installer from raw main: $RAW_INSTALL_URL"
          if download_file_with_retry "$RAW_INSTALL_URL" "$TMP_INSTALL_SCRIPT"; then
            DOWNLOAD_SOURCE="raw main (the latest release has no install.sh asset)"
          else
            echo "[WARNING] Failed to download installer from raw main after retries."
          fi
        else
          echo "[WARNING] Could not download the latest release's installer (last HTTP status: ${LAST_DOWNLOAD_HTTP_CODE:-none})."
          echo "[WARNING] Not using raw main: it only stands in for a missing asset."
        fi
        if [[ -z "$DOWNLOAD_SOURCE" ]]; then
          echo "Falling back to release-pinned installer: $RELEASE_INSTALL_URL"
          if download_file_with_retry "$RELEASE_INSTALL_URL" "$TMP_INSTALL_SCRIPT"; then
            DOWNLOAD_SOURCE="the install.sh asset of ${INSTALL_SCRIPT_REF} (release-pinned fallback)"
          else
            echo "[ERROR] Unable to download the installer: latest release asset, raw main (asset missing only) and release-pinned asset all failed."
            rm -f "$TMP_INSTALL_SCRIPT"
            exit 1
          fi
        fi
        echo "Installer: $DOWNLOAD_SOURCE. Executing..."
        # Export GITHUB_TOKEN so install.sh's `fetch_latest_release_tag` and
        # `fetch_release_feed` authenticate their api.github.com calls. Without
        # this, those calls hit the 60 req/hr unauth rate limit on github-hosted
        # runner pools, install.sh falls back to its hardcoded FALLBACK_VERSION
        # (currently 1.2.0), and we install a 6-month-old binary that fails on
        # macOS Gatekeeper (`Killed: 9`) and may lack modern CLI subcommands on
        # other platforms.
        #
        # The PIN: installers since 2.0.2 read EDAMAME_PIN. An installer from
        # before (the release-pinned floor above, or a latest release older
        # than 2.0.2) only knows --pin, so it gets that, the old shape.
        INSTALL_PIN=""
        if [[ "$PASS_PIN" == "true" ]]; then
          if grep -q 'EDAMAME_PIN' "$TMP_INSTALL_SCRIPT"; then
            INSTALL_PIN="$EDAMAME_PIN_INPUT"
          else
            echo "[INFO] This installer predates EDAMAME_PIN; passing the PIN with --pin"
            INSTALL_ARGS+=(--pin "$EDAMAME_PIN_INPUT")
          fi
        fi
        # debug: true installs debug builds (--debug-build). On macOS only an
        # installer that installs the debug PKG gets it (edamame_posture >=
        # 2.0.3 names edamame-posture-macos-<version>-debug.pkg): an older one
        # installs the raw debug binary, which macOS kills at launch (it
        # carries the Endpoint Security entitlement without the PKG's
        # provisioning profile; exit 137), and from 2.0.3 no raw macOS binary
        # is published. Such an installer installs the release PKG instead;
        # EDAMAME_LOG_LEVEL=debug still applies.
        if [[ "${{ inputs.debug }}" == "true" ]]; then
          if [[ "$RUNNER_OS" != "macOS" ]] || grep -q -- '-debug\.pkg' "$TMP_INSTALL_SCRIPT"; then
            INSTALL_ARGS+=(--debug-build)
          else
            echo "::warning::debug: true -- this installer predates the macOS debug PKG; installing the release PKG (debug logging stays on)"
          fi
        fi
        EDAMAME_PIN="$INSTALL_PIN" GITHUB_TOKEN="$GH_TOKEN_VALUE" sh "$TMP_INSTALL_SCRIPT" "${INSTALL_ARGS[@]}"
        rm -f "$TMP_INSTALL_SCRIPT"
        if [[ ! -f "$STATE_FILE" ]]; then
          echo "[WARNING] Installer did not produce state file at $STATE_FILE; reconstructing from current system state."
          binary_path=$(command -v edamame_posture 2>/dev/null || echo "")
          if [[ -z "$binary_path" ]]; then
            echo "[ERROR] Unable to locate edamame_posture binary after installation."
            exit 1
          fi
          mkdir -p "$(dirname "$STATE_FILE")"
          {
            echo "binary_path=${binary_path}"
            echo "install_method=unknown"
            echo "installed_via_package_manager=unknown"
            echo "binary_already_present=false"
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              echo "platform=linux"
            elif [[ "$RUNNER_OS" == "macOS" ]]; then
              echo "platform=macos"
            elif [[ "$RUNNER_OS" == "Windows" ]]; then
              echo "platform=windows"
            else
              echo "platform=$RUNNER_OS"
            fi
          } > "$STATE_FILE"
        fi
        echo "=== Installer State ==="
        cat "$STATE_FILE"
        # shellcheck disable=SC1090
        source "$STATE_FILE"
        echo "binary_already_present=${binary_already_present:-false}" >> "$GITHUB_OUTPUT"
        echo "installed_via_package_manager=${installed_via_package_manager:-false}" >> "$GITHUB_OUTPUT"
        echo "install_method=${install_method:-binary}" >> "$GITHUB_OUTPUT"
        echo "binary_path=${binary_path:-}" >> "$GITHUB_OUTPUT"

    - name: Keep package installs from restarting the posture daemon (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # needrestart, Ubuntu's apt hook, restarts every service linked against
        # a library apt has just upgraded. A job that installs packages after
        # this action restarted edamame_posture (libpcap-dev pulled
        # libpcap0.8t64 1.10.4-4.1ubuntu3.1 from noble-updates, 2026-09-25):
        # the stop reports a disconnect, so the Hub revokes the runner's access,
        # the organization IP allow list included, until the daemon reconnects
        # about 8 s later, and the daemon's sessions and detection state start
        # over mid-job. The daemon has to outlive the job, so needrestart lists
        # it instead of restarting it.
        if [ ! -d /etc/needrestart ]; then
          echo "needrestart not installed; nothing to configure"
          exit 0
        fi
        SUDO=""
        if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
          SUDO="sudo"
        fi
        $SUDO mkdir -p /etc/needrestart/conf.d
        echo '$nrconf{override_rc}{qr(^edamame_posture)} = 0;' \
          | $SUDO tee /etc/needrestart/conf.d/50-edamame-posture.conf >/dev/null
        echo "needrestart will list edamame_posture instead of restarting it"

    - name: Set EDAMAME_POSTURE_CMD variable
      shell: bash
      run: |
        set -euo pipefail
        echo "=== Setting EDAMAME_POSTURE_CMD ==="
        echo "Install method: ${{ steps.install_posture.outputs.install_method }}"
        echo "Installed via package manager: ${{ steps.install_posture.outputs.installed_via_package_manager }}"
        BINARY_PATH="${{ steps.install_posture.outputs.binary_path }}"
        if [[ -z "$BINARY_PATH" ]]; then
          if command -v edamame_posture >/dev/null 2>&1; then
            BINARY_PATH=$(command -v edamame_posture)
          elif [[ -f "$HOME/edamame_posture" ]]; then
            BINARY_PATH="$HOME/edamame_posture"
          elif [[ -f "$HOME/edamame_posture.exe" ]]; then
            BINARY_PATH="$HOME/edamame_posture.exe"
          else
            echo "[ERROR] edamame_posture not found!"
            exit 1
          fi
        fi
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          EDAMAME_POSTURE_CMD="$BINARY_PATH"
        else
          # Determine how to run with elevated privileges while preserving environment
          # -E flag preserves environment variables for CI/CD detection
          # The daemon checks for GITHUB_ACTIONS, CI, GITLAB_CI, etc.
          if [[ $(id -u) -eq 0 ]]; then
            # Already root, no sudo needed
            EDAMAME_POSTURE_CMD="$BINARY_PATH"
          elif command -v sudo >/dev/null 2>&1; then
            # sudo available, use -E to preserve environment
            EDAMAME_POSTURE_CMD="sudo -E $BINARY_PATH"
          elif command -v doas >/dev/null 2>&1; then
            # doas available (Alpine, OpenBSD) - preserves env by default
            EDAMAME_POSTURE_CMD="doas $BINARY_PATH"
          else
            # No privilege escalation available, try direct execution
            echo "[WARNING] No sudo/doas available and not running as root"
            EDAMAME_POSTURE_CMD="$BINARY_PATH"
          fi
        fi
        echo "Using binary at: $BINARY_PATH"
        echo "EDAMAME_BINARY_PATH=$BINARY_PATH" >> $GITHUB_ENV
        echo "EDAMAME_POSTURE_CMD=$EDAMAME_POSTURE_CMD" >> $GITHUB_ENV
        if [[ "${{ inputs.debug }}" == "true" ]]; then
          echo "EDAMAME_LOG_LEVEL=debug" >> $GITHUB_ENV
          echo "Debug logging enabled"
        fi
        echo "EDAMAME_POSTURE_CMD set to: $EDAMAME_POSTURE_CMD"

    # The findings the attack pattern detector already reports when this job's
    # setup runs: on a persistent self-hosted runner, the ones earlier jobs left
    # active (the daemon and its finding history outlive the job). This job's
    # gate reports them as warnings and fails only on findings first seen after
    # the setup. Recorded as soon as the daemon answers (a connected setup has
    # just started it); retried after a disconnected start.
    - name: Record the attack pattern findings present at setup
      id: gate_baseline
      if: steps.setup_scope.outputs.first_setup == 'true'
      shell: bash
      env:
        GATE_BASELINE_ATTEMPTS: ${{ (inputs.disconnected_mode != 'true' && inputs.edamame_user != '' && inputs.edamame_domain != '') && '15' || '1' }}
      run: |
        HELPER="${RUNNER_TEMP:-/tmp}/edamame_gate_baseline.sh"
        cat > "$HELPER" <<'HELPER_EOF'
        # record_gate_baseline ATTEMPTS: ask the daemon for its findings (2 s
        # apart) and keep their keys in the file EDAMAME_POSTURE_GATE_BASELINE
        # names. The keys are trusted only when no finding was first seen after
        # this job's setup started ("usable"): a finding the daemon reported
        # during the setup itself is not an earlier job's.
        record_gate_baseline() {
          local attempts="$1" attempt out raw count
          out="${RUNNER_TEMP:-/tmp}/edamame_gate_baseline.json"
          raw="${RUNNER_TEMP:-/tmp}/edamame_gate_baseline_raw.txt"
          for attempt in $(seq 1 "$attempts"); do
            if $EDAMAME_POSTURE_CMD attack-pattern-findings > "$raw" 2>/dev/null \
              && sed -n '/^{/,$p' "$raw" | jq -e \
                --arg setup_time "${EDAMAME_POSTURE_SETUP_TIME:-}" \
                --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
                def utc_second: if type == "string"
                  then ((capture("^(?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})([.][0-9]+)?(Z|[+]00:00)$") | .t) // null)
                  else null end;
                ($setup_time | utc_second) as $setup
                | (.timestamp | utc_second) as $newest
                | {setup_time: $setup_time,
                   recorded_at: $recorded_at,
                   report_timestamp: (.timestamp // null),
                   usable: ($setup != null and ($newest == null or $newest < $setup)),
                   findings: [(.findings // [])[] | select((.finding_key // "") != "")
                     | {finding_key, check, severity, dismissed}]}' > "$out"; then
              rm -f "$raw"
              echo "EDAMAME_POSTURE_GATE_BASELINE=$out" >> "$GITHUB_ENV"
              echo "recorded=true" >> "$GITHUB_OUTPUT"
              count=$(jq '.findings | length' "$out" | tr -d '\r')
              if [[ "$(jq -r '.usable' "$out" | tr -d '\r')" != "true" ]]; then
                echo "The detector already reports a finding first seen during this job's setup (newest detection $(jq -r '.report_timestamp' "$out" | tr -d '\r'), setup $EDAMAME_POSTURE_SETUP_TIME): the gate will not treat the findings present now as older ones."
              elif [[ "$count" -gt 0 ]]; then
                echo "$count attack pattern finding(s) were active before this job's setup ($EDAMAME_POSTURE_SETUP_TIME). This job's gate reports them as warnings and fails only on findings first seen after the setup:"
                jq -r '.findings[] | "  \(.severity // "?") \(.check // "?") \(.finding_key)\(if .dismissed == true then " (dismissed)" else "" end)"' "$out"
              else
                echo "No attack pattern finding was active before this job's setup."
              fi
              return 0
            fi
            if [[ "$attempt" -lt "$attempts" ]]; then
              sleep 2
            fi
          done
          rm -f "$raw"
          return 1
        }
        HELPER_EOF
        # shellcheck disable=SC1090
        source "$HELPER"
        if ! record_gate_baseline "$GATE_BASELINE_ATTEMPTS"; then
          echo "No posture daemon answers yet; the findings present at setup are recorded once this setup has started one (if it starts one)."
        fi

    - name: Inspect edamame_posture service (if present)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        if command -v systemctl >/dev/null 2>&1 && [[ -d /run/systemd/system ]]; then
          echo "=== systemctl status edamame_posture ==="
          sudo systemctl status edamame_posture.service --no-pager || true
          SERVICE_USER=$(systemctl show -p User edamame_posture.service 2>/dev/null | cut -d'=' -f2)
          if [[ -z "$SERVICE_USER" ]]; then
            SERVICE_USER="root (default)"
          fi
          echo "Configured systemd service user: $SERVICE_USER"
        elif command -v rc-service >/dev/null 2>&1; then
          echo "=== rc-service edamame_posture status ==="
          sudo rc-service edamame_posture status || true
          echo "OpenRC services run as root by default (override via init script as needed)."
        else
          echo "systemd/OpenRC not detected (likely container without init); skipping service inspection."
        fi

    - name: Show initial posture
      run: |
        cd
        $EDAMAME_POSTURE_CMD score
      shell: bash

    - name: Get device info and verify eBPF support
      id: device_info
      if: ${{ inputs.get_device_info == 'true' || inputs.verify_ebpf == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "=== Getting Device Info ==="
        
        # Get device info from the installed binary
        DEVICE_INFO=$($EDAMAME_POSTURE_CMD get-device-info 2>&1) || true
        echo "$DEVICE_INFO"
        echo ""
        
        # Extract eBPF support line - look for "eBPF support:" or "ebpf_support:" pattern
        # and grab only the value part (after the colon), trimming whitespace
        EBPF_LINE=$(echo "$DEVICE_INFO" | grep -iE "(eBPF support|ebpf_support)" | head -1 || echo "")
        # Extract just the status part after the colon (e.g., "Enabled: kernel 6.x..." or "Disabled: ...")
        EBPF_STATUS=$(echo "$EBPF_LINE" | sed 's/.*[Ss]upport[:"]*[[:space:]]*//' | tr -d '\n' || echo "")
        echo "=== eBPF Status ==="
        echo "$EBPF_STATUS"
        echo ""
        
        # Sanitize message for GitHub Actions output (remove newlines, escape special chars)
        sanitize_for_output() {
          echo "$1" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | head -c 500
        }
        
        # Track if we should fail (only for verify_ebpf mode)
        SHOULD_FAIL=false
        
        # Determine eBPF status category
        if [[ "$RUNNER_OS" != "Linux" ]]; then
          echo "ebpf_status=not_supported" >> "$GITHUB_OUTPUT"
          echo "ebpf_message=eBPF not supported on $RUNNER_OS" >> "$GITHUB_OUTPUT"
          echo "⏭️  eBPF not supported on $RUNNER_OS"
        elif echo "$EBPF_STATUS" | grep -q "Enabled:.*kprobe attached"; then
          echo "ebpf_status=enabled" >> "$GITHUB_OUTPUT"
          echo "ebpf_message=$(sanitize_for_output "$EBPF_STATUS")" >> "$GITHUB_OUTPUT"
          echo "✅ eBPF is fully operational (kprobes attached)"
        elif echo "$EBPF_STATUS" | grep -q "not embedded"; then
          echo "ebpf_status=disabled_build" >> "$GITHUB_OUTPUT"
          echo "ebpf_message=eBPF object not embedded (build failure)" >> "$GITHUB_OUTPUT"
          echo "❌ eBPF was NOT compiled into the binary (clang/llvm was not available at build time)"
          SHOULD_FAIL=true
        elif echo "$EBPF_STATUS" | grep -qE "unprivileged_bpf_disabled|container may lack|doesn't support kprobes|SYS_ADMIN|CAP_BPF|failed to load|failed to create"; then
          echo "ebpf_status=disabled_runtime" >> "$GITHUB_OUTPUT"
          echo "ebpf_message=$(sanitize_for_output "$EBPF_STATUS")" >> "$GITHUB_OUTPUT"
          echo "⚠️  eBPF embedded but kernel restrictions prevent loading (acceptable)"
        elif echo "$EBPF_STATUS" | grep -q "Disabled:"; then
          echo "ebpf_status=disabled_runtime" >> "$GITHUB_OUTPUT"
          echo "ebpf_message=$(sanitize_for_output "$EBPF_STATUS")" >> "$GITHUB_OUTPUT"
          echo "⚠️  eBPF disabled: $EBPF_STATUS (acceptable - runtime restriction)"
        elif echo "$EBPF_STATUS" | grep -q "Not supported"; then
          echo "ebpf_status=not_supported" >> "$GITHUB_OUTPUT"
          echo "ebpf_message=eBPF not supported on this platform" >> "$GITHUB_OUTPUT"
          echo "⏭️  eBPF not supported on this platform"
        else
          echo "ebpf_status=unknown" >> "$GITHUB_OUTPUT"
          echo "ebpf_message=Could not determine eBPF status" >> "$GITHUB_OUTPUT"
          echo "⚠️  Could not determine eBPF status from: $EBPF_STATUS"
          # Unknown status with verify_ebpf should fail
          if [[ "${{ inputs.verify_ebpf }}" == "true" ]]; then
            SHOULD_FAIL=true
          fi
        fi
        
        # Fail if verify_ebpf is enabled and we detected a build failure
        if [[ "${{ inputs.verify_ebpf }}" == "true" && "$SHOULD_FAIL" == "true" ]]; then
          echo ""
          echo "::error::eBPF verification failed - binary was not built with eBPF support"
          exit 1
        fi

    - name: Auto remediate/harden posture issues if requested and if we are not running in a self-hosted runner (the binary is already present)
      run: |
        cd
        if [[ "${{ inputs.auto_remediate }}" == "true" && "${{ steps.install_posture.outputs.binary_already_present }}" == "false" ]]; then
          if [[ "${{ inputs.skip_remediations }}" == "" ]]; then
            echo "No remediations to skip"
            $EDAMAME_POSTURE_CMD remediate
          else
            echo "Skipping remediations: ${{ inputs.skip_remediations }}"
            $EDAMAME_POSTURE_CMD remediate "${{ inputs.skip_remediations }}"
          fi
        fi
      shell: bash

    - name: Report email
      run: |
        cd
        if [[ "${{ inputs.report_email }}" != "" ]]; then
          signature=$($EDAMAME_POSTURE_CMD request-signature | grep Signature | awk '{print $2}')
          echo "Signature: $signature"
          echo "Sending compliance report to email: ${{ inputs.report_email }}"
          $EDAMAME_POSTURE_CMD request-report "${{ inputs.report_email }}" "$signature"
        fi
      shell: bash

    - name: Check local policy compliance
      run: |
        cd
        # Check if minimum score and mandatory threats are provided. Mandatory prefixes are optional.
        if [[ -n "${{ inputs.edamame_minimum_score }}" ]]; then
          echo "Checking policy compliance with minimum score: ${{ inputs.edamame_minimum_score }}, mandatory threats: ${{ inputs.edamame_mandatory_threats }} and mandatory prefixes: ${{ inputs.edamame_mandatory_prefixes }}"
          
          # Capture the policy check output, also use prefix to check for mandatory threats
          policy_output=$($EDAMAME_POSTURE_CMD check-policy "${{ inputs.edamame_minimum_score }}" "${{ inputs.edamame_mandatory_threats }}" "${{ inputs.edamame_mandatory_prefixes }}")
          policy_status=$?
          
          echo "$policy_output"
          
          # Check if the policy check was successful
          if [[ $policy_status -ne 0 ]]; then
            echo "Device does not comply with the required policy with minimum score: ${{ inputs.edamame_minimum_score }}, mandatory threats: ${{ inputs.edamame_mandatory_threats }} and mandatory prefixes: ${{ inputs.edamame_mandatory_prefixes }}"
            echo "Exiting workflow due to policy non-compliance."
            exit 1
          fi
          
          echo "Device complies with the required policy with minimum score: ${{ inputs.edamame_minimum_score }}, mandatory threats: ${{ inputs.edamame_mandatory_threats }} and mandatory prefixes: ${{ inputs.edamame_mandatory_prefixes }}"
        fi
      shell: bash

    - name: Check domain policy compliance
      run: |
        cd
        # Check if both domain and policy are provided
        if [[ -n "${{ inputs.edamame_domain }}" && -n "${{ inputs.edamame_policy }}" ]]; then
          POLICY_NAME="${{ inputs.edamame_policy }}"
          DOMAIN_NAME="${{ inputs.edamame_domain }}"
          
          echo "Checking policy compliance with domain: $DOMAIN_NAME and policy: $POLICY_NAME"
          
          # Capture the policy check output - use variables to avoid shell interpretation issues
          policy_output=$($EDAMAME_POSTURE_CMD check-policy-for-domain "$DOMAIN_NAME" "$POLICY_NAME")
          policy_status=$?
          
          echo "$policy_output"
          
          # Check if the policy check was successful
          if [[ $policy_status -ne 0 ]]; then
            echo "Device does not comply with the required policy: $POLICY_NAME and domain: $DOMAIN_NAME"
            echo "Exiting workflow due to policy non-compliance."
            exit 1
          fi
          
          echo "Device complies with the required policy: $POLICY_NAME and domain: $DOMAIN_NAME"
        fi
      shell: bash

    - name: Wait for EDAMAME Posture connection
      if: ${{ inputs.dump_sessions_log != 'true' && inputs.stop != 'true' && inputs.disconnected_mode != 'true' }}
      run: |
        cd
        # Note: Daemon/service is now started by install.sh with all parameters
        # This step only waits for connection when credentials are provided
        
        echo "Waiting for EDAMAME Posture to connect..."
        if [[ -n "${{ inputs.edamame_user }}" && -n "${{ inputs.edamame_domain }}" && -n "${EDAMAME_PIN_INPUT:-}" ]]; then
          dump_posture_logs() {
            # Prefer the systemd/package log dir. Never walk $HOME recursively:
            # cargo color-eyre fixtures and unrelated *_panic_*.txt files drown
            # the dump and trip permission-denied noise on self-hosted runners.
            if [[ -d /var/log/edamame ]]; then
              sudo find /var/log/edamame -maxdepth 1 -type f \
                \( -name "edamame_*.2*-*-*" -o -name "*_panic_*.txt" \) \
                -exec echo "--- {} ---" \; -exec sudo tail -c 2000000 {} \; 2>/dev/null \
                || echo "No logs found in /var/log/edamame"
            else
              find "${HOME:-.}" -maxdepth 2 -type f \
                \( -name "edamame_*.2*-*-*" -o -name "*_panic_*.txt" \) \
                -exec echo "--- {} ---" \; -exec tail -c 2000000 {} \; 2>/dev/null \
                || echo "No logs found"
            fi
          }

          wait_for_connection_once() {
            local timeout_arg="${1:-}"
            WAIT_LOG="${RUNNER_TEMP:-/tmp}/edamame_wait_for_connection.log"
            set +e
            if [[ -n "$timeout_arg" ]]; then
              $EDAMAME_POSTURE_CMD wait-for-connection "$timeout_arg" >"$WAIT_LOG" 2>&1
            else
              $EDAMAME_POSTURE_CMD wait-for-connection >"$WAIT_LOG" 2>&1
            fi
            local rc=$?
            set -e
            cat "$WAIT_LOG"
            return "$rc"
          }

          wait_for_connection_with_retry() {
            local timeout_arg="${1:-}"
            # Hub can take minutes under load to make a freshly reported CI
            # device visible (NonExistentDevice). Keep retrying longer than
            # the previous 6x10s budget so Setup does not fail the job while
            # the device is still propagating.
            local max_attempts=12
            local delay_seconds=20
            local attempt=1

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "wait-for-connection attempt $attempt/$max_attempts"
              if wait_for_connection_once "$timeout_arg"; then
                return 0
              fi

              # Transient Hub-side classes on the report/connection path, retried
              # instead of failing setup:
              #   NonExistentDevice / InvalidSignature -> DynamoDB history-stream
              #     propagation race (device reported but policy/history lookup has
              #     not caught up yet).
              #   InputValidationFailed (E01) -> report HMAC timestamp outside the
              #     Hub's +/-300s window (runner clock drift; the clock-sync step
              #     above fixes the common case, this retry covers residual skew).
              if grep -qE "NonExistentDevice|InvalidSignature|InputValidationFailed" "$WAIT_LOG" && [ "$attempt" -lt "$max_attempts" ]; then
                echo "[WARN] Transient backend error while waiting for connection; retrying in ${delay_seconds}s..."
                sleep "$delay_seconds"
                attempt=$((attempt + 1))
                continue
              fi

              dump_posture_logs
              return 1
            done

            dump_posture_logs
            return 1
          }

          # On Windows, set a timeout of 1800 seconds instead of the default 900 seconds.
          # GitHub-hosted Windows runners sit on a /20 subnet with a virtual neighbor
          # table and no responsive gateway, so the initial blocking LAN scan
          # (scan_gateways_task sweeps 1020 hard-coded RFC1918 gateway candidates
          # via ICMP before connect_domain() runs) routinely takes ~20 minutes.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wait_for_connection_with_retry 1800 || exit 1
          else
            wait_for_connection_with_retry || exit 1
          fi
        else
          echo "No connection parameters provided, skipping connection wait"
        fi
      shell: bash
      env:
        EDAMAME_PIN_INPUT: ${{ inputs.edamame_pin }}
    
    - name: Start EDAMAME Posture in disconnected mode if requested
      if: ${{ inputs.disconnected_mode == 'true' && inputs.dump_sessions_log != 'true' && (inputs.dump_attack_pattern_findings || inputs.dump_vulnerability_findings) != 'true' && inputs.dump_attack_pattern_trace != 'true' && inputs.stop != 'true' }}
      run: |
        cd
        if [[ "${{ inputs.disconnected_mode }}" == "true" ]]; then
          echo "Starting EDAMAME Posture in disconnected mode..."
          
          # Stop any existing posture process before starting in disconnected mode
          # This handles cases where disconnected mode is called multiple times or after connected mode
          echo "Stopping any existing EDAMAME Posture process..."
          
          # Try to stop via CLI first
          $EDAMAME_POSTURE_CMD stop > /dev/null 2>&1 || true
          
          # On Linux, also ensure systemd service is stopped (in case it was started manually)
          if [[ "$RUNNER_OS" == "Linux" ]] && command -v systemctl >/dev/null 2>&1; then
          sudo systemctl stop edamame_posture.service 2>/dev/null || true
          fi
          
          # Give it a moment to fully stop
          sleep 2

          START_ARGS=(background-start-disconnected)

          if [[ "${{ inputs.network_scan }}" == "true" ]]; then
          START_ARGS+=(--network-scan)
          fi

          if [[ "${{ inputs.packet_capture }}" == "true" || ( "${{ inputs.packet_capture }}" == "auto" && "${{ inputs.network_scan }}" == "true" ) ]]; then
            START_ARGS+=(--packet-capture)
          fi

          if [[ "${{ inputs.whitelist }}" != "" ]]; then
            START_ARGS+=(--whitelist "${{ inputs.whitelist }}")
          fi

          if [[ "${{ inputs.check_whitelist }}" == "true" || "${{ inputs.whitelist }}" != "" ]]; then
            START_ARGS+=(--fail-on-whitelist)
          fi

          if [[ "${{ inputs.check_blacklist }}" == "true" ]]; then
            START_ARGS+=(--fail-on-blacklist)
          fi

          if [[ "${{ inputs.attack_pattern_detection || inputs.vulnerability_detection }}" == "true" && "${{ inputs.exit_on_attack_pattern_findings || inputs.exit_on_vulnerability_findings }}" == "true" ]]; then
            START_ARGS+=(--fail-on-findings)
          fi

          if [[ "${{ inputs.cancel_on_violation }}" == "true" ]]; then
            START_ARGS+=(--cancel-on-violation)
          fi

          if [[ "${{ inputs.include_local_traffic }}" == "true" ]]; then
            START_ARGS+=(--include-local-traffic)
          fi

          if [[ "${{ inputs.agentic_mode }}" != "disabled" && "${{ inputs.agentic_mode }}" != "" ]]; then
            START_ARGS+=(--agentic-mode "${{ inputs.agentic_mode }}")
          fi
          
          # Add agentic provider for disconnected mode
          if [[ "${{ inputs.agentic_provider }}" != "none" && "${{ inputs.agentic_provider }}" != "" ]]; then
            START_ARGS+=(--agentic-provider "${{ inputs.agentic_provider }}")
          fi

          if [[ "${{ inputs.agentic_interval }}" != "3600" && -n "${{ inputs.agentic_interval }}" ]]; then
            START_ARGS+=(--agentic-interval "${{ inputs.agentic_interval }}")
          fi

          # Verify cancellation script exists (was created earlier in the install step)
          if [[ "${{ inputs.cancel_on_violation }}" == "true" ]]; then
            CANCEL_SCRIPT_PATH="${{ inputs.cancel_pipeline_script }}"
            if [[ -z "$CANCEL_SCRIPT_PATH" ]]; then
              # Same $HOME as used during creation (sudo -E preserves HOME)
              CANCEL_SCRIPT_PATH="$HOME/cancel_pipeline.sh"
            fi
            if [[ -f "$CANCEL_SCRIPT_PATH" ]]; then
              echo "[OK] Cancellation script verified at $CANCEL_SCRIPT_PATH"
            else
              echo "[WARNING] Cancellation script NOT found at $CANCEL_SCRIPT_PATH"
            fi
          fi

          $EDAMAME_POSTURE_CMD "${START_ARGS[@]}"

          # Start file integrity monitoring if requested
          if [[ "${{ inputs.file_monitoring }}" == "true" ]]; then
            echo "Starting file integrity monitoring..."
            FIM_ARGS=(start-file-monitor)
            if [[ "${{ inputs.file_monitoring_paths }}" != "" ]]; then
              FIM_ARGS+=(--paths "${{ inputs.file_monitoring_paths }}")
            fi
            # background-start returns as soon as the daemon is spawned; its RPC
            # server can still be a few seconds away. Wait for it the same way
            # the attack-pattern-detector step does, otherwise the first RPC
            # fails with "transport error" and the whole job aborts in setup.
            fim_started=false
            for attempt in $(seq 1 30); do
              if $EDAMAME_POSTURE_CMD "${FIM_ARGS[@]}" 2>/tmp/edamame_fim_start.err; then
                fim_started=true
                break
              fi
              if ! grep -qi "transport error" /tmp/edamame_fim_start.err; then
                cat /tmp/edamame_fim_start.err
                break
              fi
              echo "  daemon RPC not ready yet (attempt ${attempt}/30); waiting 2s..."
              sleep 2
            done
            if [ "$fim_started" != "true" ]; then
              echo "::error::Failed to start file integrity monitor"
              exit 1
            fi
          fi
        fi
      shell: bash

    - name: Record the attack pattern findings present at setup (after the daemon start)
      if: >
        steps.setup_scope.outputs.first_setup == 'true' &&
        steps.gate_baseline.outputs.recorded != 'true' &&
        (inputs.disconnected_mode == 'true' || (inputs.edamame_user != '' && inputs.edamame_domain != ''))
      shell: bash
      run: |
        HELPER="${RUNNER_TEMP:-/tmp}/edamame_gate_baseline.sh"
        if [[ ! -f "$HELPER" ]]; then
          exit 0
        fi
        # shellcheck disable=SC1090
        source "$HELPER"
        if ! record_gate_baseline 30; then
          echo "::warning::The posture daemon did not answer during setup: no findings were recorded for this job's gate, so a finding an earlier job left active still fails it whenever any finding is first seen after the setup."
        fi

    - name: Start attack pattern detector if requested
      if: ${{ (inputs.attack_pattern_detection || inputs.vulnerability_detection) == 'true' && inputs.dump_sessions_log != 'true' && (inputs.dump_attack_pattern_findings || inputs.dump_vulnerability_findings) != 'true' && inputs.dump_attack_pattern_trace != 'true' && inputs.stop != 'true' }}
      run: |
        set -euo pipefail
        cd
        interval="${{ inputs.attack_pattern_detection_interval || inputs.vulnerability_detection_interval }}"
        if ! [[ "$interval" =~ ^[0-9]+$ ]] || (( interval <= 0 )); then
          echo "::error::attack_pattern_detection_interval (or legacy vulnerability_detection_interval) must be a positive integer"
          exit 1
        fi
        echo "Starting runtime attack pattern detector with interval ${interval}s"
        # CLI uses legacy `vulnerability-*` names for backward compatibility
        # with older edamame_posture binaries. Newer binaries also accept
        # `attack-pattern-*` aliases.
        #
        # Wait for the daemon's RPC socket before issuing the command. This
        # step used to fire immediately after daemon start and intermittently
        # lost the race:
        #
        #   Error starting vulnerability detector: transport error
        #   Caused by: tcp connect error / Connection refused (os error 111)
        #
        # which failed the whole job before any attack scenario ran. That is
        # why the Attack Detection Demo alternated pass/fail on an UNCHANGED
        # action SHA (failures 08-19, 08-21, 08-25, 08-27 with successes in
        # between) -- it was never the detector, only daemon readiness.
        #
        # `attack-pattern-status` is a read-only probe, so polling it is safe
        # and it succeeds exactly when the RPC endpoint is accepting calls.
        vuln_started=false
        for attempt in $(seq 1 30); do
          if $EDAMAME_POSTURE_CMD attack-pattern-status >/dev/null 2>&1; then
            vuln_started=true
            break
          fi
          echo "  daemon RPC not ready yet (attempt ${attempt}/30); waiting 2s..."
          sleep 2
        done
        if [ "$vuln_started" != "true" ]; then
          echo "::error::Daemon RPC never became reachable; cannot start the attack pattern detector."
          exit 1
        fi
        $EDAMAME_POSTURE_CMD vulnerability-start "$interval"
        # Publication without the LLM adjudicator. The default (`llm`) is the
        # daemon's own default and issues no command, so binaries that predate
        # the subcommand keep working; the other two values require it.
        adjudication_mode="${{ inputs.adjudication_mode }}"
        if [[ -n "$adjudication_mode" && "$adjudication_mode" != "llm" ]]; then
          $EDAMAME_POSTURE_CMD vulnerability-adjudication-mode "$adjudication_mode"
        fi
        $EDAMAME_POSTURE_CMD attack-pattern-status || true
      shell: bash

    # We must wait here as we can use the API to download the whitelist artifact from the previous run
    - name: Wait for API access to be granted if requested
      if: ${{ inputs.dump_sessions_log != 'true' && (inputs.dump_attack_pattern_findings || inputs.dump_vulnerability_findings) != 'true' && inputs.dump_attack_pattern_trace != 'true' && inputs.stop != 'true' }}
      run: |
        if [[ "${{ inputs.wait_for_api }}" == "true" ]]; then
          echo "Waiting for GitHub API access to be granted..."
          echo "Note: This runs AFTER the daemon has started and connected"
          echo "      so the daemon can whitelist the runner IP via EDAMAME backend"
          attempts=0
          timeout=true
          last_error=""
          # A public repository is readable whatever the IP allow list says,
          # so the probe targets wait_repository when set (the private or
          # internal repository the job needs). The Hub can take over ten
          # minutes to admit a hosted runner, hence 20 attempts (~19 min).
          if [[ -n "${{ inputs.wait_repository }}" ]]; then
            probe_endpoint="repos/${{ inputs.wait_repository }}"
          else
            probe_endpoint="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          echo "Probing: $probe_endpoint"

          for i in {1..20}; do
            attempts=$((attempts + 1))
            echo "Attempt $attempts: Testing API access..."
            
            # Probes with the action's token. In a private repository the run
            # details API is blocked until the runner is listed; in a public one
            # it answers at once (public reads are not restricted), which is why
            # wait_repository exists. Capture stdout and stderr for the log.
            if output=$(gh api "$probe_endpoint" 2>&1); then
              timeout=false
              echo "[OK] API access granted!"
              break
            else
              exit_code=$?
              last_error="$output"
              echo "[WARNING] API call failed with exit code $exit_code"
              echo "Error output: $last_error"
              
              if [ $attempts -lt 20 ]; then
                echo "Waiting 60 seconds before retry..."
                sleep 60
              fi
            fi
          done

          # Calculate elapsed time (first attempt is immediate, subsequent attempts wait 60s each)
          if [ $attempts -gt 1 ]; then
            elapsed_time=$(( (attempts - 1) * 60 ))
          else
            elapsed_time=0
          fi
          elapsed_minutes=$((elapsed_time / 60))
          elapsed_seconds=$((elapsed_time % 60))

          if [ "$timeout" = true ]; then
            echo ""
            echo "[ERROR] Timeout occurred while waiting for API access."
            echo "Total attempts: $attempts"
            echo "Total time before timeout: ${elapsed_minutes} minutes and ${elapsed_seconds} seconds."
            echo "Last error: $last_error"
            echo ""
            echo "Dumping EDAMAME logs for debugging..."
            cd
            find . \( -name "edamame_*.2*-*-*" -o -name "*_panic_*.txt" \) -exec echo "--- {} ---" \; -exec cat {} \; || echo "No logs found"
            exit 1
          else
            echo "Time taken to grant access: ${elapsed_minutes} minutes and ${elapsed_seconds} seconds."
          fi
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}

    - name: Wait for https access to the repo be granted if requested
      if: ${{ inputs.dump_sessions_log != 'true' && (inputs.dump_attack_pattern_findings || inputs.dump_vulnerability_findings) != 'true' && inputs.dump_attack_pattern_trace != 'true' && inputs.stop != 'true' }}
      run: |
        if [[ "${{ inputs.wait_for_https }}" == "true" ]]; then
          echo "Waiting for HTTPS access to the repository..."
          echo "Note: This runs AFTER the daemon has started and connected"
          echo "      so the daemon can whitelist the runner IP via EDAMAME backend"
          attempts=0
          timeout=true
          # See the API wait: probe the repository the job needs, not a
          # public one the allow list does not guard.
          repo_url="https://github.com/${{ inputs.wait_repository || github.repository }}.git"
          echo "Probing: $repo_url"
          last_status=""

          for i in {1..20}; do
            attempts=$((attempts + 1))
            echo "Attempt $attempts: Checking HTTPS access to the repo..."
            status_code=$(curl -o /dev/null -s -w "%{http_code}" -H "Authorization: token ${ACTION_TOKEN:-}" "$repo_url")
            last_status="$status_code"

            if [[ "$status_code" == "301" || "$status_code" == "200" ]]; then
              timeout=false
              echo "[OK] HTTPS access granted (status: $status_code)!"
              break
            else
              echo "[WARNING] HTTPS access not yet granted. Status Code: $status_code"
              if [ $attempts -lt 20 ]; then
                echo "Waiting 60 seconds before retry..."
                sleep 60
              fi
            fi
          done

          # Calculate elapsed time (first attempt is immediate, subsequent attempts wait 60s each)
          if [ $attempts -gt 1 ]; then
            elapsed_time=$(( (attempts - 1) * 60 ))
          else
            elapsed_time=0
          fi
          elapsed_minutes=$((elapsed_time / 60))
          elapsed_seconds=$((elapsed_time % 60))

          if [ "$timeout" = true ]; then
            echo ""
            echo "[ERROR] Timeout occurred while waiting for HTTPS access to the repo."
            echo "Total attempts: $attempts"
            echo "Total time before timeout: ${elapsed_minutes} minutes and ${elapsed_seconds} seconds."
            echo "Last status code: $last_status"
            echo ""
            echo "Dumping EDAMAME logs for debugging..."
            cd
            find . \( -name "edamame_*.2*-*-*" -o -name "*_panic_*.txt" \) -exec echo "--- {} ---" \; -exec cat {} \; || echo "No logs found"
            exit 1
          else
            echo "Time taken to grant access: ${elapsed_minutes} minutes and ${elapsed_seconds} seconds."
          fi
        fi
      shell: bash
      env:
        ACTION_TOKEN: ${{ inputs.token }}

    - name: Wait for a while if requested
      run: |
        if [[ "${{ inputs.wait }}" == "true" ]]; then
          sleep 180
        fi
      shell: bash

    # Whitelist the job asked for, recorded so its teardown checks that list
    # and nothing else. On a persistent runner the installer reuses a daemon
    # an earlier job started, and that daemon keeps the earlier job's
    # whitelist: a named whitelist is applied here explicitly (an unknown name
    # fails the job), and a job that asks for none is never judged against a
    # whitelist it inherited.
    - name: Apply this job's whitelist
      if: >
        inputs.dump_sessions_log != 'true' &&
        (inputs.dump_attack_pattern_findings || inputs.dump_vulnerability_findings) != 'true' &&
        inputs.dump_attack_pattern_trace != 'true' &&
        inputs.stop != 'true' &&
        (inputs.disconnected_mode == 'true' || (inputs.edamame_user != '' && inputs.edamame_domain != ''))
      shell: bash
      env:
        REQUESTED_WHITELIST: ${{ inputs.whitelist }}
        AUTO_WHITELIST: ${{ inputs.auto_whitelist }}
        SET_CUSTOM_WHITELISTS: ${{ inputs.set_custom_whitelists }}
        CUSTOM_WHITELISTS_PATH: ${{ inputs.custom_whitelists_path }}
        CREATE_CUSTOM_WHITELISTS: ${{ inputs.create_custom_whitelists }}
      run: |
        set -euo pipefail
        REQUEST_FILE="${RUNNER_TEMP}/edamame-whitelist-request.json"
        active_whitelist() { $EDAMAME_POSTURE_CMD get-whitelist-name 2>/dev/null | tr -d '\r' | tail -1 || true; }
        # What the daemon enforced when this job set up: a whitelist it still
        # enforces unchanged at teardown was inherited, not set by this job.
        ACTIVE_AT_SETUP=$(active_whitelist)
        record() {
          jq -n --arg kind "$1" --arg name "$2" --arg active "$ACTIVE_AT_SETUP" \
            '{kind: $kind, name: $name, active_at_setup: $active}' > "$REQUEST_FILE"
        }

        if [[ "$AUTO_WHITELIST" == "true" ]]; then
          record auto custom_whitelist
          echo "Whitelist: auto_whitelist (loaded by the next step)"
          exit 0
        fi
        if [[ "$SET_CUSTOM_WHITELISTS" == "true" && -n "$CUSTOM_WHITELISTS_PATH" && "$CREATE_CUSTOM_WHITELISTS" != "true" ]]; then
          record custom custom_whitelist
          echo "Whitelist: custom whitelist from $CUSTOM_WHITELISTS_PATH (loaded by the next step)"
          exit 0
        fi
        if [[ -n "$REQUESTED_WHITELIST" ]]; then
          # Wait for the daemon's RPC (a disconnected start returns before it listens).
          for attempt in $(seq 1 30); do
            if $EDAMAME_POSTURE_CMD get-whitelist-name >/dev/null 2>&1; then break; fi
            echo "  daemon RPC not ready yet (attempt ${attempt}/30); waiting 2s..."
            sleep 2
          done
          set +e
          SET_OUTPUT=$($EDAMAME_POSTURE_CMD set-whitelist "$REQUESTED_WHITELIST" 2>&1)
          SET_RC=$?
          set -e
          if [[ $SET_RC -ne 0 ]]; then
            if echo "$SET_OUTPUT" | grep -qiE "unrecognized subcommand|unexpected argument"; then
              # A posture binary older than 2.0.3 has no set-whitelist: the
              # daemon got the name at start. Check it holds it and knows it.
              if ! $EDAMAME_POSTURE_CMD get-whitelists 2>/dev/null | sed -n '/^{/,$p' \
                | jq -e --arg n "$REQUESTED_WHITELIST" '[.whitelists[].name] | index($n) != null' >/dev/null 2>&1; then
                echo "::error::Whitelist '$REQUESTED_WHITELIST' is not defined: it would enforce nothing. Defined: $($EDAMAME_POSTURE_CMD get-whitelists 2>/dev/null | sed -n '/^{/,$p' | jq -r '[.whitelists[].name] | join(", ")' 2>/dev/null)"
                exit 1
              fi
              ACTIVE=$(active_whitelist)
              if [[ "$ACTIVE" != "$REQUESTED_WHITELIST" ]]; then
                echo "::error::The daemon enforces '${ACTIVE:-no whitelist}', not the requested '$REQUESTED_WHITELIST' (a daemon an earlier job started, reused as it is), and this posture binary cannot switch it. Upgrade edamame_posture to 2.0.3 or later."
                exit 1
              fi
            else
              echo "$SET_OUTPUT"
              echo "::error::Whitelist '$REQUESTED_WHITELIST' was not applied (for instance an unknown name: the named lists are edamame, builder, github, github_macos, github_ubuntu, github_windows)."
              exit 1
            fi
          else
            echo "$SET_OUTPUT"
          fi
          record named "$REQUESTED_WHITELIST"
          echo "Whitelist: $REQUESTED_WHITELIST (enforced by the daemon)"
          exit 0
        fi
        record none ""
        if [[ -n "$ACTIVE_AT_SETUP" ]]; then
          echo "::warning::The daemon enforces whitelist '$ACTIVE_AT_SETUP', which this job did not ask for (an earlier job on this persistent runner set it). This job's teardown checks a whitelist only if the job sets one."
        else
          echo "Whitelist: none requested"
        fi

    # Auto-whitelist: take this runner pool's whitelist from a trusted
    # earlier run (same workflow, branch and repository, never a fork),
    # decide this run's mode from the state it was saved with, and load it.
    # Any failure to list or download the artifact fails the job: only an
    # answered listing without an eligible artifact starts a new whitelist.
    # The logic is in scripts/auto_whitelist.sh (tested by
    # tests/test_auto_whitelist_logic.sh).
    - name: Set up the auto-whitelist
      id: auto_whitelist_setup
      if: >
        inputs.auto_whitelist == 'true' &&
        inputs.dump_sessions_log != 'true' &&
        inputs.stop != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        AW_ARTIFACT_NAME: ${{ inputs.auto_whitelist_artifact_name }}
        AW_STATE_ARTIFACT_NAME: ${{ inputs.auto_whitelist_state_artifact_name }}
        AW_THRESHOLD: ${{ inputs.auto_whitelist_stability_threshold }}
        AW_CONSECUTIVE: ${{ inputs.auto_whitelist_stability_consecutive_runs }}
        AW_MAX_ITERATIONS: ${{ inputs.auto_whitelist_max_iterations }}
        AW_DISCONNECTED: ${{ inputs.disconnected_mode }}
      run: bash "${{ github.action_path }}/scripts/auto_whitelist.sh" setup

    - name: Apply custom whitelists if provided
      if: >
        inputs.dump_sessions_log != 'true' &&
        inputs.set_custom_whitelists == 'true' &&
        inputs.custom_whitelists_path != '' &&
        inputs.create_custom_whitelists != 'true'
      shell: bash
      env:
        CUSTOM_WHITELISTS_PATH: ${{ inputs.custom_whitelists_path }}
      run: |
        set -euo pipefail
        cd
        if [[ ! -f "$CUSTOM_WHITELISTS_PATH" ]]; then
          echo "::error::Custom whitelists file not found at $CUSTOM_WHITELISTS_PATH"
          exit 1
        fi
        ENDPOINT_COUNT=$(jq '[.whitelists[]? | select(.name == "custom_whitelist") | .endpoints? // [] | length] | add // 0' "$CUSTOM_WHITELISTS_PATH" 2>/dev/null | tr -d '\r' || echo "?")
        if [[ "$ENDPOINT_COUNT" == "0" ]]; then
          # An empty whitelist is loaded as it is: it allows nothing, so every
          # egress session is non-conforming.
          echo "::warning::$CUSTOM_WHITELISTS_PATH has no endpoints: every egress session will be non-conforming."
        fi
        echo "Applying custom whitelists from: $CUSTOM_WHITELISTS_PATH ($ENDPOINT_COUNT endpoints)"
        # The CLI refuses a whitelist the daemon does not load (malformed JSON,
        # an unknown field, no custom_whitelist) and exits non-zero.
        $EDAMAME_POSTURE_CMD set-custom-whitelists-from-file "$CUSTOM_WHITELISTS_PATH"
        ACTIVE=$($EDAMAME_POSTURE_CMD get-whitelist-name 2>/dev/null | tr -d '\r' | tail -1 || true)
        if [[ "$ACTIVE" != "custom_whitelist" ]]; then
          echo "::error::After loading $CUSTOM_WHITELISTS_PATH the daemon enforces '${ACTIVE:-no whitelist}', not custom_whitelist."
          exit 1
        fi
        echo "Custom whitelists applied."
        # This job's whitelist from now on, whichever invocation loaded it.
        REQUEST_FILE="${RUNNER_TEMP}/edamame-whitelist-request.json"
        ACTIVE_AT_SETUP=$(jq -r '.active_at_setup // ""' "$REQUEST_FILE" 2>/dev/null | tr -d '\r' || true)
        jq -n --arg active "$ACTIVE_AT_SETUP" '{kind: "custom", name: "custom_whitelist", active_at_setup: $active}' > "$REQUEST_FILE"

    - name: Augment existing custom whitelists if requested
      if: ${{ inputs.augment_custom_whitelists == 'true' }}
      shell: bash
      env:
        CUSTOM_WHITELISTS_PATH: ${{ inputs.custom_whitelists_path }}
      run: |
        set -euo pipefail
        cd
        if [[ -z "$CUSTOM_WHITELISTS_PATH" ]]; then
          echo "::error::augment_custom_whitelists requires custom_whitelists_path to be set."
          exit 1
        fi

        if [[ -f "$CUSTOM_WHITELISTS_PATH" ]]; then
          # Learn on top of the file (the reviewed list), from the traffic
          # seen since this job's setup: the daemon's live whitelist, which
          # anything in the job may have replaced, is not what gets written.
          echo "Augmenting $CUSTOM_WHITELISTS_PATH with the traffic seen since ${EDAMAME_POSTURE_SETUP_TIME:-the capture started}..."
          set +e
          AUG=$($EDAMAME_POSTURE_CMD augment-custom-whitelists-from-file "$CUSTOM_WHITELISTS_PATH" --since "${EDAMAME_POSTURE_SETUP_TIME:-}" 2>"${RUNNER_TEMP}/edamame_augment.err")
          AUG_RC=$?
          set -e
          if echo "$AUG" | jq -e '.success == true and (.whitelist | type == "object")' >/dev/null 2>&1; then
            echo "$AUG" | jq '.whitelist' > "$CUSTOM_WHITELISTS_PATH"
            echo "Added $(echo "$AUG" | jq '.added | length' | tr -d '\r') endpoint(s):"
            echo "$AUG" | jq -r '.added[] | "  \(.protocol // "?") \(.domain // (.domains // [] | join(","))) \(.ip // ((.ips // []) | join(","))) ports=\(.port // ((.ports // []) | tostring))\(if .unresolved_only then " AS\(.as_number) (unnamed traffic only)" else "" end)"'
            echo "Augmented whitelist saved to: $CUSTOM_WHITELISTS_PATH"
            exit 0
          fi
          if grep -qiE "unrecognized subcommand|unexpected argument" "${RUNNER_TEMP}/edamame_augment.err" 2>/dev/null; then
            echo "::warning::This edamame_posture predates augment-custom-whitelists-from-file (2.0.3): augmenting the daemon's live whitelist instead."
          else
            cat "${RUNNER_TEMP}/edamame_augment.err" >&2 || true
            echo "::error::Augmenting $CUSTOM_WHITELISTS_PATH failed (exit $AUG_RC): $(echo "$AUG" | jq -r '.error // empty' 2>/dev/null)"
            exit 1
          fi
        fi

        echo "Generating augmented whitelist from the daemon's live whitelist and its current exceptions..."
        AUG_JSON=$($EDAMAME_POSTURE_CMD augment-custom-whitelists)
        if [[ -z "$AUG_JSON" ]]; then
          echo "::error::augment-custom-whitelists returned empty output"
          exit 1
        fi
        ENDPOINT_COUNT=$(echo "$AUG_JSON" | jq '[.whitelists[]? | select(.name == "custom_whitelist") | .endpoints? // [] | length] | add // 0' 2>/dev/null || echo "0")
        echo "Augmented whitelist contains $ENDPOINT_COUNT endpoints"
        if [[ "$ENDPOINT_COUNT" -eq 0 ]]; then
          echo "::error::The augmented whitelist is empty: load a baseline first (set_custom_whitelists: true) and capture traffic."
          exit 1
        fi
        echo "$AUG_JSON" > "$CUSTOM_WHITELISTS_PATH"
        echo "Augmented whitelist saved to: $CUSTOM_WHITELISTS_PATH"


    - name: Checkout the repo through the git CLI if requested
      run: |
        if [[ "${{ inputs.checkout }}" == "true" ]]; then
          timeout=true

          # Initialize the repo if it doesn't exist
          git init || true

          # Add the remote if it doesn't exist (support GHES/self-hosted via GITHUB_SERVER_URL)
          server_url="${GITHUB_SERVER_URL:-https://github.com}"
          server_url="${server_url%/}"
          if [[ "$server_url" == *"://"* ]]; then
            server_scheme="${server_url%%://*}"
            server_host_path="${server_url#*://}"
          else
            server_scheme="https"
            server_host_path="$server_url"
          fi
          remote_url="${server_scheme}://x-access-token:${ACTION_TOKEN:-}@${server_host_path}/${{ github.repository }}.git"
          if git remote | grep -q '^origin$'; then
            git remote set-url origin "$remote_url" || true
          else
            git remote add origin "$remote_url" || true
          fi
          for i in {1..10}; do
            echo "Attempt $i: Checking out the repo through the git CLI..."
            if git fetch --depth=1 origin ${{ github.ref }}; then
              branch_name=$(echo "${{ github.ref }}" | sed -e "s/^refs\/heads\///")
              if git checkout -B "$branch_name" FETCH_HEAD; then
                if [[ "${{ inputs.checkout_submodules }}" == "true" ]]; then
                  git submodule update --init --recursive
                fi
                timeout=false
                break
              fi
            else
              echo "Checkout of the repo through the git CLI failed. Waiting for 60 seconds..."
              sleep 60
            fi
          done

          elapsed_time=$((i * 60))
          elapsed_minutes=$((elapsed_time / 60))
          elapsed_seconds=$((elapsed_time % 60))

          if [ "$timeout" = true ]; then
            echo "Timeout occurred while waiting for access to the repo through the git CLI."
            echo "Total time before timeout: ${elapsed_minutes} minutes and ${elapsed_seconds} seconds."
            # Dump the logs
            cd
            find . \( -name "edamame_*.2*-*-*" -o -name "*_panic_*.txt" \) -exec echo "--- {} ---" \; -exec cat {} \; || echo "No logs found"
            exit 1
          else
            echo "Checkout of the repo through the git CLI succeeded."
            echo "Time taken to checkout: ${elapsed_minutes} minutes and ${elapsed_seconds} seconds."

            # Verify the checked out commit and branch
            echo "Checked out branch: $(git rev-parse --abbrev-ref HEAD)"
            echo "Checked out commit: $(git rev-parse HEAD)"
            if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
              echo "Warning: The checked out commit does not match the expected SHA."
              echo "Expected: ${{ github.sha }}"
              echo "Actual: $(git rev-parse HEAD)"
            fi
          fi
        fi
      shell: bash
      env:
        ACTION_TOKEN: ${{ inputs.token }}

    - name: Create custom whitelists from network sessions if requested
      run: |
        if [[ "${{ inputs.create_custom_whitelists }}" == "true" ]]; then
          cd
          echo "Creating custom whitelists from active network sessions..."
          
          # Build the command with optional --include-process flag
          CREATE_CMD="$EDAMAME_POSTURE_CMD create-custom-whitelists"
          if [[ "${{ inputs.include_process_in_whitelist }}" == "true" ]]; then
            CREATE_CMD="$CREATE_CMD --include-process"
            echo "Including process names in whitelist for stricter matching"
          fi
          
          if [[ -n "${{ inputs.custom_whitelists_path }}" ]]; then
            # Create-custom-whitelists relies on a cache that is populated by get-sessions.
            # In CI, sessions/exceptions can lag behind traffic generation, so we flush and retry.
            $EDAMAME_POSTURE_CMD get-sessions > /dev/null 2>&1 || true

            attempt=1
            max_attempts=5
            ENDPOINT_COUNT=0
            while [[ "$attempt" -le "$max_attempts" ]]; do
              echo "Creating custom whitelists (attempt $attempt/$max_attempts)..."
              $CREATE_CMD > "${{ inputs.custom_whitelists_path }}"

              if command -v jq &> /dev/null; then
                ENDPOINT_COUNT=$(jq '[.whitelists[]? | select(.name == "custom_whitelist") | .endpoints? // [] | length] | add // 0' "${{ inputs.custom_whitelists_path }}" 2>/dev/null || echo "0")
                echo "Created whitelist contains $ENDPOINT_COUNT endpoints"
                if [[ "$ENDPOINT_COUNT" -gt 0 ]]; then
                  break
                fi
              else
                echo "[WARNING]  Warning: jq not available, cannot verify endpoint count"
                break
              fi

              attempt=$((attempt + 1))
              if [[ "$attempt" -le "$max_attempts" ]]; then
                echo "[INFO] No endpoints yet; waiting for sessions to flush and retrying"
                $EDAMAME_POSTURE_CMD get-sessions > /dev/null 2>&1 || true
                sleep 5
              fi
            done

            if command -v jq &> /dev/null && [[ "$ENDPOINT_COUNT" -eq 0 ]]; then
              echo "[WARNING]  Warning: Created whitelist is empty (no endpoints)"
              echo "This can happen if:"
              echo "  - No network sessions were captured yet (wait longer before creating whitelist)"
              echo "  - Only ingress (local-to-local) sessions exist (these are excluded from whitelists)"
              echo "  - All sessions were filtered out"
              echo "The whitelist file was created but will not be loaded automatically if empty"
            fi

            echo "Custom whitelists saved to: ${{ inputs.custom_whitelists_path }}"
          else
            # Just display the whitelist JSON
            $CREATE_CMD
          fi
        fi
      shell: bash

    # Auto-whitelist teardown. The run's mode was decided at setup, from the
    # state the whitelist was saved with:
    # - enforcing: this job's egress traffic (sessions active since its setup)
    #   is checked against the whitelist file the job downloaded; anything
    #   new is a violation and is NOT learned, unless promote_exceptions is
    #   true, which adds it without review and says so;
    # - learning: the traffic is learned, and a run that saw nothing new
    #   counts toward stability.
    # The step records the verdict and the next state; the job fails at the
    # end (after the artifact is saved) on a violation or when the check
    # could not run (capture not running, daemon refusal).
    - name: Check and learn the auto-whitelist
      id: auto_whitelist_teardown
      if: ${{ inputs.dump_sessions_log == 'true' }}
      shell: bash
      env:
        AW_PROMOTE: ${{ inputs.promote_exceptions }}
      run: bash "${{ github.action_path }}/scripts/auto_whitelist.sh" teardown

    - name: Dump attack pattern findings if requested
      if: ${{ (inputs.dump_attack_pattern_findings || inputs.dump_vulnerability_findings) == 'true' }}
      run: |
        set -euo pipefail
        cd
        STATUS_FILE="${RUNNER_TEMP:-/tmp}/edamame_vulnerability_status.json"
        FINDINGS_FILE="${RUNNER_TEMP:-/tmp}/edamame_vulnerability_findings.json"

        # Dump per-finding details (finding_key, check, severity, description,
        # process_*, destination_*, open_files, detection_basis). The action
        # requires posture binaries that expose `attack-pattern-findings` and
        # `attack-pattern-status --fail-on-findings` (edamame_posture >= 1.3.18
        # has these names; the legacy `vulnerability-*` ones go in 3.0).
        echo "Executing: $EDAMAME_POSTURE_CMD attack-pattern-findings --active-only"
        $EDAMAME_POSTURE_CMD attack-pattern-findings --active-only 2>&1 | tee "$FINDINGS_FILE"

        echo "Executing: $EDAMAME_POSTURE_CMD attack-pattern-status"
        $EDAMAME_POSTURE_CMD attack-pattern-status | tee "$STATUS_FILE"
        if [[ "${{ inputs.exit_on_attack_pattern_findings || inputs.exit_on_vulnerability_findings }}" == "true" ]]; then
          echo "Executing: $EDAMAME_POSTURE_CMD attack-pattern-status --fail-on-findings"
          gate_rc=0
          $EDAMAME_POSTURE_CMD attack-pattern-status --fail-on-findings || gate_rc=$?
          if [[ "$gate_rc" -ne 1 ]]; then
            # 0: no active HIGH/CRITICAL finding. 2 and up: the detector is off
            # or stalled, its adjudication stays withheld, or the daemon did not
            # answer. None of that depends on when a finding was first seen.
            exit "$gate_rc"
          fi

          # Exit 1: active HIGH/CRITICAL findings. On a persistent self-hosted
          # runner the daemon and its finding history outlive the job, so a
          # finding an earlier job left active would fail every later job. This
          # job's gate fails only on findings first seen after its setup
          # (EDAMAME_POSTURE_SETUP_TIME); the older ones are printed as warnings
          # with their first-seen time. Nothing is dismissed or cleared.
          #
          # A finding is older when any of these holds:
          #   - its key was active when this job's setup recorded the findings
          #     present (EDAMAME_POSTURE_GATE_BASELINE), and nothing had been
          #     first seen since the setup started at that point;
          #   - the newest first detection of the whole history (the report's
          #     `timestamp`) predates the setup, so nothing is newer;
          #   - the finding carries its own `first_detected` and it predates the
          #     setup (daemons that report it per finding).
          SCOPE_RAW="${RUNNER_TEMP:-/tmp}/edamame_gate_scope_raw.txt"
          SCOPE_FILE="${RUNNER_TEMP:-/tmp}/edamame_gate_scope.json"
          BASELINE_FILE="${EDAMAME_POSTURE_GATE_BASELINE:-}"
          if [[ -z "$BASELINE_FILE" || ! -f "$BASELINE_FILE" ]]; then
            BASELINE_FILE="${RUNNER_TEMP:-/tmp}/edamame_gate_no_baseline.json"
            echo 'null' > "$BASELINE_FILE"
          fi
          if ! $EDAMAME_POSTURE_CMD attack-pattern-findings --active-only > "$SCOPE_RAW" 2>/dev/null \
            || ! sed -n '/^{/,$p' "$SCOPE_RAW" | jq -c \
              --slurpfile baseline "$BASELINE_FILE" \
              --arg setup_time "${EDAMAME_POSTURE_SETUP_TIME:-}" '
              def utc_second: if type == "string"
                then ((capture("^(?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})([.][0-9]+)?(Z|[+]00:00)$") | .t) // null)
                else null end;
              def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
              ($setup_time | utc_second) as $setup
              | (.timestamp // null) as $newest_text
              | ($newest_text | utc_second) as $newest
              | ($baseline[0] // null) as $b
              | ($b != null and $b.usable == true) as $b_ok
              | [($b.findings // [])[] | .finding_key] as $known
              | ($setup != null and $newest != null and $newest < $setup) as $none_new
              | [(.findings // [])[]
                  | select((.dismissed // false) | not)
                  | select((.severity // "" | ascii_upcase) as $s | $s == "HIGH" or $s == "CRITICAL")
                  | (.first_detected // null) as $first_text
                  | ($first_text | utc_second) as $first
                  | (.finding_key // "") as $k
                  | ($b_ok and $k != "" and any($known[]; . == $k)) as $known_at_setup
                  | {older: ($known_at_setup or $none_new
                             or ($setup != null and $first != null and $first < $setup)),
                     line: ("\(.severity) \(.check // "?") (key \($k))"
                            + (if (.process_name // "") != "" then ", process \(.process_name)" else "" end)
                            + (if (.destination_domain // .destination_ip // "") != ""
                               then ", destination \(.destination_domain // .destination_ip)" else "" end)
                            + ": "
                            + (if $first != null then "first seen \($first_text)"
                               elif $known_at_setup and ($b.report_timestamp // null) != null
                               then "first seen no later than \($b.report_timestamp)"
                               elif $known_at_setup then "already active when this job was set up"
                               elif $none_new then "first seen no later than \($newest_text)"
                               else "first seen after this job was set up" end)
                            | esc)}]
              | {baseline: (if $b == null then "none" elif $b_ok then "usable" else "unusable" end),
                 alertable: length,
                 new: [.[] | select(.older | not) | .line],
                 older: [.[] | select(.older) | .line]}' > "$SCOPE_FILE"; then
            echo "::error::Could not list the active findings to tell this job's from older ones; every active finding counts."
            exit 1
          fi
          read -r ALERTABLE NEW_COUNT OLDER_COUNT BASELINE_STATE < <(jq -r '"\(.alertable) \(.new | length) \(.older | length) \(.baseline)"' "$SCOPE_FILE" | tr -d '\r')
          SETUP_TIME="${EDAMAME_POSTURE_SETUP_TIME:-}"
          if [[ -z "$SETUP_TIME" ]]; then
            echo "No setup time was recorded for this job (its setup did not run through this version of the action), so every active finding counts."
          elif [[ "$BASELINE_STATE" != "usable" ]]; then
            echo "No usable record of the findings present at this job's setup ($BASELINE_STATE): a finding counts as older only if nothing at all was first seen after the setup."
          fi
          if [[ "$ALERTABLE" -eq 0 ]]; then
            echo "::error::The detector reports active HIGH/CRITICAL findings, but none could be listed to tell this job's from older ones; every active finding counts."
            exit 1
          fi
          jq -r '.older[]' "$SCOPE_FILE" | tr -d '\r' | while IFS= read -r line; do
            echo "::warning title=Attack pattern finding from before this job::${line}. This job set up at ${SETUP_TIME}; the finding does not fail it and stays in the history: triage it on the runner and dismiss it if it is benign."
          done
          if [[ "$NEW_COUNT" -gt 0 ]]; then
            jq -r '.new[]' "$SCOPE_FILE" | tr -d '\r' | while IFS= read -r line; do
              echo "::error title=Attack pattern finding from this job::${line}"
            done
            echo "$NEW_COUNT active HIGH/CRITICAL finding(s) first seen after this job's setup${SETUP_TIME:+ ($SETUP_TIME)}; $OLDER_COUNT older one(s) reported as warnings."
            exit 1
          fi
          echo "All $ALERTABLE active HIGH/CRITICAL finding(s) predate this job's setup ($SETUP_TIME): reported as warnings, not failing this job. The finding history is unchanged."
        fi
      shell: bash

    - name: Dump attack pattern debug trace if requested
      id: dump_attack_pattern_trace
      if: ${{ inputs.dump_attack_pattern_trace == 'true' }}
      run: |
        set -euo pipefail
        cd
        # Canonical CI capture path for the FP replay corpus
        # (see edamame_core/FPREPLAY.md). Dumps three artifacts the
        # operator-side `tools/ingest_ci_fp_corpus.sh` shaper consumes:
        #
        #   trace.json     The full VulnerabilityDebugTrace JSON from
        #                  the latest detector tick (`input_snapshot`,
        #                  `deterministic_findings`, `llm_decision`,
        #                  ...) -- this is the deterministic replay
        #                  input for `cargo test --test fp_replay`.
        #
        #   findings.json  Active findings for cross-reference (a
        #                  human picks which finding maps to which
        #                  FP-ID).
        #
        #   meta.json      Workflow run provenance so the corpus
        #                  envelope can record where the trace came
        #                  from without the operator typing it.
        #
        # Requires a posture binary that exposes
        # `attack-pattern-debug-trace --latest`
        # (edamame_posture >= 1.3.18+).
        OUT_DIR="${RUNNER_TEMP:-/tmp}/edamame-fp-capture"
        mkdir -p "$OUT_DIR"
        TRACE_FILE="$OUT_DIR/trace.json"
        FINDINGS_FILE="$OUT_DIR/findings.json"
        META_FILE="$OUT_DIR/meta.json"

        echo "Executing: $EDAMAME_POSTURE_CMD attack-pattern-debug-trace --latest"
        # Fail-soft on older posture binaries: emit a `{"error": ...}`
        # envelope so the artifact still uploads and the ingestion
        # script can surface a meaningful message.
        if ! $EDAMAME_POSTURE_CMD attack-pattern-debug-trace --latest > "$TRACE_FILE" 2>&1; then
          echo "::warning::attack-pattern-debug-trace failed (posture binary may predate 1.3.18). Captured stderr in trace.json."
          # Re-wrap stderr as a JSON-readable error envelope.
          err_msg="$(cat "$TRACE_FILE")"
          jq -n --arg err "$err_msg" '{"error": $err}' > "$TRACE_FILE" || true
        fi

        echo "Executing: $EDAMAME_POSTURE_CMD attack-pattern-findings --active-only"
        $EDAMAME_POSTURE_CMD attack-pattern-findings --active-only > "$FINDINGS_FILE" 2>&1 || true

        # Provenance for the corpus envelope.
        CORE_VERSION=""
        if VINFO="$($EDAMAME_POSTURE_CMD --version 2>/dev/null)"; then
          CORE_VERSION="$(echo "$VINFO" | awk 'NR==1 {print $NF}')"
        fi
        cat > "$META_FILE" <<META_EOF
        {
          "captured_at":          "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "captured_from_host":   "$(hostname -s 2>/dev/null || echo "ci-runner")",
          "captured_from_runner": "${RUNNER_NAME:-unknown}",
          "captured_from_os":     "${RUNNER_OS:-unknown}",
          "captured_from_arch":   "${RUNNER_ARCH:-unknown}",
          "captured_from_core_version": "${CORE_VERSION}",
          "github_repository":    "${GITHUB_REPOSITORY:-}",
          "github_workflow":      "${GITHUB_WORKFLOW:-}",
          "github_run_id":        "${GITHUB_RUN_ID:-}",
          "github_run_number":    "${GITHUB_RUN_NUMBER:-}",
          "github_sha":           "${GITHUB_SHA:-}",
          "github_ref":           "${GITHUB_REF:-}",
          "github_job":           "${GITHUB_JOB:-}"
        }
        META_EOF
        echo "Wrote FP-capture artifact to: $OUT_DIR"
        ls -la "$OUT_DIR"
        echo "fp_capture_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Upload attack pattern debug trace artifact
      if: ${{ inputs.dump_attack_pattern_trace == 'true' && always() }}
      uses: actions/upload-artifact@v4
      with:
        name: edamame-fp-capture-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index || '0' }}
        path: ${{ steps.dump_attack_pattern_trace.outputs.fp_capture_dir }}
        retention-days: 30
        overwrite: true
        if-no-files-found: warn

    - name: Dump sessions log if requested
      if: ${{ inputs.dump_sessions_log == 'true' }}
      shell: bash
      env:
        EXIT_ON_WHITELIST_EXCEPTIONS: ${{ inputs.exit_on_whitelist_exceptions }}
        EXIT_ON_BLACKLISTED_SESSIONS: ${{ inputs.exit_on_blacklisted_sessions }}
        EXIT_ON_ANOMALOUS_SESSIONS: ${{ inputs.exit_on_anomalous_sessions }}
      run: |
        set -euo pipefail
        cd
        ARGS=(get-sessions)
        REQUEST_FILE="${RUNNER_TEMP}/edamame-whitelist-request.json"

        if [[ "${AUTO_WHITELIST_ENABLED:-false}" == "true" ]]; then
          # The auto-whitelist teardown step checked this job's traffic
          # against its own whitelist; the job fails on its verdict at the end.
          echo "[INFO] Auto-whitelist: this job's whitelist verdict is '${AUTO_WHITELIST_VERDICT:-?}' (see the step 'Check and learn the auto-whitelist'); the session list below is informational for the whitelist."
        elif [[ "$EXIT_ON_WHITELIST_EXCEPTIONS" == "true" ]]; then
          REQUEST_KIND=""
          if [[ -f "$REQUEST_FILE" ]]; then
            REQUEST_KIND=$(jq -r '.kind' "$REQUEST_FILE" | tr -d '\r')
            REQUEST_NAME=$(jq -r '.name' "$REQUEST_FILE" | tr -d '\r')
          fi
          case "$REQUEST_KIND" in
            none)
              ACTIVE=$($EDAMAME_POSTURE_CMD get-whitelist-name 2>/dev/null | tr -d '\r' | tail -1 || true)
              ACTIVE_AT_SETUP=$(jq -r '.active_at_setup // ""' "$REQUEST_FILE" | tr -d '\r')
              if [[ -n "$ACTIVE" && "$ACTIVE" != "$ACTIVE_AT_SETUP" ]]; then
                # The job set this whitelist itself (outside the action): check it.
                ARGS+=(--fail-on-whitelist)
              elif [[ -n "$ACTIVE" ]]; then
                echo "[INFO] This job asked for no whitelist; the daemon's '$ACTIVE' was already there when the job set up (an earlier job on this runner), so it does not judge this job."
              else
                echo "[INFO] No whitelist is active: exit_on_whitelist_exceptions has nothing to check."
              fi
              ;;
            named | custom)
              ACTIVE=$($EDAMAME_POSTURE_CMD get-whitelist-name 2>/dev/null | tr -d '\r' | tail -1 || true)
              if [[ "$ACTIVE" != "$REQUEST_NAME" ]]; then
                echo "::error::The daemon now enforces '${ACTIVE:-no whitelist}', not this job's '$REQUEST_NAME' (it changed during the job: another job on a shared daemon, or a build step). This job's traffic cannot be certified against its whitelist."
                exit 1
              fi
              ARGS+=(--fail-on-whitelist)
              ;;
            *)
              # Set up elsewhere: the CLI decides. It fails when a whitelist is
              # active but capture is not running, or the traffic does not conform.
              ARGS+=(--fail-on-whitelist)
              ;;
          esac
        fi

        if [[ "$EXIT_ON_BLACKLISTED_SESSIONS" == "true" ]]; then
          ARGS+=(--fail-on-blacklist)
        fi

        if [[ "$EXIT_ON_ANOMALOUS_SESSIONS" == "true" ]]; then
          ARGS+=(--fail-on-anomalous)
        fi

        echo "Executing: $EDAMAME_POSTURE_CMD ${ARGS[*]}"
        $EDAMAME_POSTURE_CMD "${ARGS[@]}"

    - name: Check file integrity monitoring events
      if: ${{ inputs.check_file_tampering == 'true' }}
      run: |
        echo "Checking file integrity monitoring events..."
        FIM_ARGS=(get-file-events)
        if [[ "${{ inputs.exit_on_file_tampering }}" == "true" ]]; then
          FIM_ARGS+=(--fail-on-suspicious)
        fi
        $EDAMAME_POSTURE_CMD "${FIM_ARGS[@]}"
      shell: bash
      env:
        EDAMAME_POSTURE_CMD: ${{ env.EDAMAME_POSTURE_CMD }}

    - name: Collect EDAMAME daemon logs if requested
      if: ${{ inputs.display_logs == 'true' }}
      shell: bash
      run: |
        set +e
        LOG_DEST="${RUNNER_TEMP:-/tmp}/edamame-daemon-logs"
        mkdir -p "$LOG_DEST"
        case "$RUNNER_OS" in
          Linux|macOS)
            if [[ -d /var/log/edamame ]]; then
              sudo cp -a /var/log/edamame/. "$LOG_DEST/" 2>/dev/null || true
              sudo chmod -R a+r "$LOG_DEST" 2>/dev/null || true
            fi
            # Fallback: catch files left in $HOME (logger fallback path)
            cd
            find . -maxdepth 2 \( -name "edamame_*.2*-*-*" -o -name "*_panic_*.txt" \) \
              -exec cp {} "$LOG_DEST/" \; 2>/dev/null || true
            ;;
          Windows)
            BIN_DIR=$(dirname "${EDAMAME_BINARY_PATH:-}")
            if [[ -n "$BIN_DIR" && -d "$BIN_DIR" ]]; then
              find "$BIN_DIR" -maxdepth 1 -type f \
                \( -name 'edamame_*_*.2*-*-*' -o -name '*_panic_*.txt' \) \
                -print0 | xargs -0 -I {} cp "{}" "$LOG_DEST/" 2>/dev/null || true
            fi
            ;;
        esac
        echo "EDAMAME_DAEMON_LOGS_PATH=$LOG_DEST" >> "$GITHUB_ENV"
        echo "--- /var/log/edamame contents ---"
        [[ "$RUNNER_OS" != "Windows" ]] && (sudo ls -la /var/log/edamame/ 2>/dev/null || true)
        echo "--- daemon log dump (capped at 2MB/file) ---"
        find "$LOG_DEST" -type f \
          -exec echo "=== {} ===" \; \
          -exec tail -c 2000000 {} \; 2>/dev/null || true
        echo "--- end daemon log dump ---"

    - name: Upload auto-whitelist artifact
      if: >
        always() &&
        inputs.dump_sessions_log == 'true' &&
        steps.auto_whitelist_teardown.outcome == 'success' &&
        env.AUTO_WHITELIST_ENABLED == 'true' &&
        env.AUTO_WHITELIST_UPLOAD == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.EDAMAME_AUTO_WHITELIST_ARTIFACT }}
        path: |
          ${{ runner.temp }}/edamame-auto-whitelist/auto_whitelist.json
          ${{ runner.temp }}/edamame-auto-whitelist/auto_whitelist_state.json
          ${{ runner.temp }}/edamame-auto-whitelist/auto_whitelist_verdict.json
          ${{ runner.temp }}/edamame-auto-whitelist/auto_whitelist_added.json
        retention-days: 90
        overwrite: true
        if-no-files-found: error

    - name: Fail on an auto-whitelist violation
      if: >
        always() &&
        inputs.dump_sessions_log == 'true' &&
        steps.auto_whitelist_teardown.outcome == 'success' &&
        env.AUTO_WHITELIST_ENABLED == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/auto_whitelist.sh" finalize

    - name: Stop EDAMAME Posture process if requested
      run: |
        if [[ "${{ inputs.stop }}" == "true" ]]; then
          cd
          echo "Stopping EDAMAME Posture process..."
          set +e
          $EDAMAME_POSTURE_CMD stop &
          stop_pid=$!
          stop_elapsed=0
          stop_timeout=30
          while kill -0 "$stop_pid" 2>/dev/null; do
            if [[ "$stop_elapsed" -ge "$stop_timeout" ]]; then
              echo "Warning: stop command timed out after ${stop_timeout}s; continuing to verification/force-kill path."
              kill "$stop_pid" 2>/dev/null || true
              sleep 1
              kill -9 "$stop_pid" 2>/dev/null || true
              break
            fi
            sleep 1
            stop_elapsed=$((stop_elapsed + 1))
          done
          wait "$stop_pid" 2>/dev/null
          stop_rc=$?
          set -e
          if [[ "$stop_rc" -ne 0 && "$stop_elapsed" -lt "$stop_timeout" ]]; then
            echo "Warning: stop command exited with rc=$stop_rc; continuing to verification/force-kill path."
          fi
          
          # Wait for daemon to fully stop
          echo "Verifying daemon has stopped..."
          MAX_ATTEMPTS=10
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if ! $EDAMAME_POSTURE_CMD status >/dev/null 2>&1; then
              echo "Daemon successfully stopped (attempt $ATTEMPT)"
              break
            fi
            
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "Warning: Daemon still running after $ATTEMPT attempts, forcing kill..."
              # Force kill on final attempt
              if [[ "$RUNNER_OS" == "Windows" ]]; then
                taskkill //F //IM edamame_posture.exe 2>/dev/null || true
              else
                pkill -9 edamame_posture 2>/dev/null || true
                if [[ "$RUNNER_OS" == "Linux" ]]; then
                  sudo systemctl stop edamame_posture.service 2>/dev/null || true
                  sudo rc-service edamame_posture stop 2>/dev/null || true
                fi
              fi
              sleep 1
              break
            fi
            
            echo "Daemon still running, waiting... (attempt $ATTEMPT/$MAX_ATTEMPTS)"
            ATTEMPT=$((ATTEMPT + 1))
            sleep 1
          done
          
          echo "EDAMAME Posture process stopped."
        fi
      shell: bash
